<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit: would you let this through?</title>
<style>
  :root {
    --bg: #f6f4ef; --panel: #ffffff; --ink: #1c1b19; --muted: #6b675f; --line: #e3dfd6;
    --accent: #1f5eff; --good: #1a7f4b; --good-bg: #e4f4ea; --bad: #b3261e; --bad-bg: #fbe9e7; --unsure: #8a6a00; --unsure-bg: #fbf3d9;
    --add: #d8f2df; --add-ink: #11602f; --del: #fbe0dc; --del-ink: #9b1c13; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14130f; --panel: #1d1c18; --ink: #f1eee6; --muted: #a29d91; --line: #34322b; --accent: #7aa2ff;
      --good: #6fd39b; --good-bg: #17301f; --bad: #ff8b80; --bad-bg: #3a1b18; --unsure: #f0cc5a; --unsure-bg: #33290c;
      --add: #17321f; --add-ink: #8fe0ad; --del: #3a1b18; --del-ink: #ff9d93; --shadow: none; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.5 -apple-system, "Segoe UI", "Helvetica Neue", Arial, "Noto Sans", "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1280px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .bar h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .bar .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .progress { flex: 1; min-width: 120px; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  button { font: inherit; cursor: pointer; }
  .ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 6px 12px; }
  .ghost:hover { border-color: var(--accent); }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 20px 320px; }
  .intro { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px 26px; box-shadow: var(--shadow); max-width: 860px; margin: 28px auto; }
  .intro h2 { margin: 0 0 8px; font-size: 26px; letter-spacing: -.02em; }
  .intro p, .intro li { color: var(--muted); }
  .intro strong { color: var(--ink); }
  .primary { background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; box-shadow: var(--shadow); }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
  .headline { font-size: 21px; line-height: 1.3; font-weight: 700; letter-spacing: -.01em; margin: 0 0 4px; }
  .headline a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); }
  .headline a:hover { border-color: var(--accent); }
  .date { color: var(--muted); font-size: 14px; }
  .entity { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin: 18px 0 6px; }
  .entity b { font-size: 22px; letter-spacing: -.01em; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; background: var(--line); color: var(--muted); letter-spacing: .03em; }
  .summary { margin: 4px 0 14px; }
  blockquote { margin: 0; padding: 12px 16px; border-left: 4px solid var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); border-radius: 0 10px 10px 0; }
  blockquote .orig { display: block; margin-top: 8px; color: var(--muted); font-size: 15px; }
  .record-name { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .uid { color: var(--muted); font-size: 13px; margin-left: 8px; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 12px; }
  .fact { font-size: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 3px 9px; }
  .fact i { font-style: normal; color: var(--muted); margin-right: 5px; }
  details { margin: 6px 0 14px; } summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  .desc { margin: 8px 0 0; font-size: 15px; color: var(--muted); }
  .changes h3 { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .change { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: var(--bg); }
  .change .what { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; font-weight: 700; }
  .change .how { font-weight: 500; color: var(--muted); font-size: 14px; }
  ins { background: var(--add); color: var(--add-ink); text-decoration: none; border-radius: 4px; padding: 0 2px; }
  del { background: var(--del); color: var(--del-ink); border-radius: 4px; padding: 0 2px; }
  .skip { color: var(--muted); font-style: italic; }
  .none { padding: 14px 16px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); box-shadow: 0 -8px 30px rgba(0,0,0,.08); z-index: 6; }
  .dock .in { max-width: 1280px; margin: 0 auto; padding: 14px 20px 16px; }
  .q { font-weight: 700; margin-bottom: 10px; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .v { flex: 1; min-width: 200px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); padding: 12px 16px; font-weight: 700; text-align: left; }
  .v small { display: block; font-weight: 500; color: var(--muted); }
  .v kbd { float: right; font: 600 12px ui-monospace, monospace; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
  .v:hover { border-color: var(--accent); }
  .v.on.yes { border-color: var(--good); background: var(--good-bg); }
  .v.on.no { border-color: var(--bad); background: var(--bad-bg); }
  .v.on.unsure { border-color: var(--unsure); background: var(--unsure-bg); }
  .why { margin-top: 12px; display: none; }
  .why.show { display: block; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 99px; padding: 5px 13px; font-size: 14px; }
  .chip.on { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); font-weight: 700; }
  textarea { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); color: var(--ink); resize: vertical; min-height: 40px; }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; color: var(--muted); font-size: 14px; }
  .nav .ghost { padding: 4px 12px; }
  .saved { color: var(--good); font-weight: 700; opacity: 0; transition: opacity .2s; } .saved.on { opacity: 1; }
  /* results */
  .big { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin: 18px 0; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 22px; box-shadow: var(--shadow); }
  .stat .n { font-size: 44px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
  .stat .t { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .stat.good .n { color: var(--good); } .stat.bad .n { color: var(--bad); }
  .row { display: grid; grid-template-columns: 210px 1fr 60px; gap: 12px; align-items: center; margin: 8px 0; }
  .track { height: 16px; background: var(--line); border-radius: 99px; overflow: hidden; display: flex; }
  .track i { display: block; height: 100%; }
  .legend { color: var(--muted); font-size: 14px; display: flex; gap: 16px; flex-wrap: wrap; }
  .legend b { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
  pre { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 13px; max-height: 260px; overflow: auto; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header><div class="bar">
  <h1>Audit</h1><span class="count" id="count"></span>
  <div class="progress"><i id="prog"></i></div>
  <button class="ghost" id="bResults">Results</button>
  <button class="ghost" id="bExport">Export CSV</button>
</div></header>
<main id="main"></main>
<div class="dock hidden" id="dock"><div class="in">
  <div class="q" id="question"></div>
  <div class="btns">
    <button class="v yes" data-v="yes"><kbd>1</kbd>Yes, correct<small>I would let this through unchecked</small></button>
    <button class="v no" data-v="no"><kbd>2</kbd>No, something is wrong<small>say what</small></button>
    <button class="v unsure" data-v="unsure"><kbd>3</kbd>Can't tell<small>not enough to judge</small></button>
  </div>
  <div class="why" id="why">
    <div class="chips" id="chips"></div>
    <textarea id="note" placeholder="Optional note"></textarea>
  </div>
  <div class="nav"><button class="ghost" id="prev">← Back</button><span class="saved" id="saved">Saved</span><button class="ghost" id="next">Next →</button></div>
</div></div>

<script id="data" type="application/json">__CARDS__</script>
<script>
const CARDS = JSON.parse(document.getElementById('data').textContent);
const REASONS = [["record","Wrong record (a different person or organisation)"],["unsupported","A change is not supported by the article"],["date","Wrong date, year or number"],["damaged","Existing text was damaged or removed"],["wording","Wording or style problem"],["other","Other"]];
const STORE = 'jev-audit-v1';
let mem = {};
function load() { try { return JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) { return mem; } }
function save(a) { mem = a; try { localStorage.setItem(STORE, JSON.stringify(a)); } catch (e) {} }
let answers = load(), idx = 0, view = 'intro', startedAt = Date.now();
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HOW = {APPEND:"Add to the list", MERGE:"Rewrite the description (new text highlighted)", REPLACE:"Replace the value", INSERT_RELATION:"Add a link to another record"};

function diffHtml(parts) {
  return parts.map(p => {
    const w = p.text.split(/\s+/);
    if (p.op === 'same') { if (w.length > 44) return esc(w.slice(0, 16).join(' ')) + ' <span class="skip">[… ' + (w.length - 32) + ' words unchanged …]</span> ' + esc(w.slice(-16).join(' ')); return esc(p.text); }
    return p.op === 'in' ? ' <ins>' + esc(p.text) + '</ins> ' : ' <del>' + esc(p.text) + '</del> ';
  }).join('');
}
function changeHtml(c) {
  let body;
  if (c.parts) body = '<div>' + diffHtml(c.parts) + '</div>';
  else if (c.strategy === 'APPEND') body = '<div>' + (c.have ? '<span class="skip">Already there: ' + esc(c.have) + '</span><br>' : '') + 'Adds: <ins>' + esc(c.value) + '</ins></div>';
  else if (c.strategy === 'REPLACE') body = '<div>' + (c.have ? '<del>' + esc(c.have) + '</del> → ' : '') + '<ins>' + esc(c.value) + '</ins></div>';
  else body = '<div><ins>' + esc(c.value) + '</ins></div>';
  return '<div class="change"><div class="what"><span class="pill">' + esc(c.field) + '</span><span class="how">' + (HOW[c.strategy] || esc(c.strategy)) + '</span></div>' + body + '</div>';
}
function cardHtml(c) {
  const facts = Object.entries(c.record.facts).map(([k, v]) => '<span class="fact"><i>' + esc(k) + '</i>' + esc(v) + '</span>').join('');
  const d = c.record.description || '';
  const desc = d ? '<details ' + (d.length < 500 ? 'open' : '') + '><summary>Current description' + (d.length >= 500 ? ' (' + d.length + ' characters)' : '') + '</summary><p class="desc">' + esc(d) + '</p></details>' : '';
  const changes = c.changes.length ? '<div class="changes"><h3>What would be written</h3>' + c.changes.map(changeHtml).join('') + '</div>' : '<div class="changes"><h3>What would be written</h3><div class="none">Nothing. The record is only linked to this article; no field changes.</div></div>';
  return '<div class="grid">' +
   '<section class="panel"><div class="label">From the article</div>' +
     '<p class="headline">' + (c.url ? '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.headline) + '</a>' : esc(c.headline)) + '</p>' +
     '<div class="date">' + esc(c.published) + '</div>' +
     '<div class="entity"><b>' + esc(c.entityEn && c.entityEn !== c.entity ? c.entityEn : c.entity) + '</b>' + (c.entityEn && c.entityEn !== c.entity ? '<span>(' + esc(c.entity) + ')</span>' : '') + '<span class="pill">' + esc(c.type) + '</span></div>' +
     '<p class="summary">' + esc(c.summary) + '</p>' +
     (c.quote || c.original ? '<blockquote>' + esc(c.quote || c.original) + (c.quote && c.original && c.original !== c.quote ? '<span class="orig">' + esc(c.original) + '</span>' : '') + '</blockquote>' : '') +
   '</section>' +
   '<section class="panel"><div class="label">The record it would update</div>' +
     '<div><span class="record-name">' + esc(c.record.name) + '</span><span class="uid">' + esc(c.record.uid) + '</span></div>' +
     '<div class="facts">' + facts + '</div>' + desc + changes +
   '</section></div>';
}
function render() {
  const done = Object.keys(answers).length;
  $('count').textContent = view === 'card' ? (idx + 1) + ' / ' + CARDS.length + ' · ' + done + ' answered' : done + ' / ' + CARDS.length + ' answered';
  $('prog').style.width = (done / CARDS.length * 100) + '%';
  $('dock').classList.toggle('hidden', view !== 'card');
  if (view === 'intro') {
    const n = CARDS.length;
    $('main').innerHTML = '<div class="intro"><h2>Would you let this through unchecked?</h2>' +
      '<p>' + n + ' cards, each showing what the pipeline proposes to write into a name authority record. For each, decide whether you would be happy for it to be applied <strong>with nobody checking</strong>.</p>' +
      '<ul><li><strong>Yes</strong>: the record is the right person or body, and every change is supported by the article and correctly written.</li>' +
      '<li><strong>No</strong>: pick what is wrong. One wrong thing is enough.</li>' +
      '<li><strong>Can\'t tell</strong>: use sparingly.</li></ul>' +
      '<p>Cards are in random order. Some may be wrong on purpose. Keys: <strong>1</strong> yes, <strong>2</strong> no, <strong>3</strong> can\'t tell, <strong>← →</strong> to move. Your answers save in this browser as you go. Use <strong>Export CSV</strong> at any time.</p>' +
      '<p><button class="primary" id="go">' + (done ? 'Continue (' + done + ' done)' : 'Start') + '</button></p></div>';
    $('go').onclick = () => { idx = Math.min(firstOpen(), CARDS.length - 1); view = 'card'; startedAt = Date.now(); render(); };
  } else if (view === 'card') {
    const c = CARDS[idx], a = answers[c.id] || {};
    $('main').innerHTML = cardHtml(c);
    $('question').textContent = c.changes.length ? 'Would you let this record and these changes through unchecked?' : 'Is this the right record for the entity in the article?';
    document.querySelectorAll('.v').forEach(b => b.classList.toggle('on', a.verdict === b.dataset.v));
    $('why').classList.toggle('show', a.verdict === 'no');
    $('chips').innerHTML = REASONS.map(([k, t]) => '<button class="chip' + ((a.reasons || []).includes(k) ? ' on' : '') + '" data-k="' + k + '">' + t + '</button>').join('');
    $('note').value = a.note || '';
    document.querySelectorAll('.chip').forEach(ch => ch.onclick = () => { const x = answers[c.id] || {}; const r = new Set(x.reasons || []); r.has(ch.dataset.k) ? r.delete(ch.dataset.k) : r.add(ch.dataset.k); x.reasons = [...r]; commit(c, x); render(); });
    $('prev').disabled = idx === 0; $('next').disabled = false;
    window.scrollTo({ top: 0 });
  } else if (view === 'results') results();
}
function firstOpen() { const i = CARDS.findIndex(c => !answers[c.id]); return i < 0 ? 0 : i; }
function commit(c, x) { x.ms = (x.ms || 0) + (Date.now() - startedAt); startedAt = Date.now(); answers[c.id] = x; save(answers); const s = $('saved'); s.classList.add('on'); setTimeout(() => s.classList.remove('on'), 900); }
function answer(v) {
  const c = CARDS[idx], x = answers[c.id] || {}; x.verdict = v; if (v !== 'no') x.reasons = []; x.note = $('note').value; commit(c, x);
  if (v === 'no') { render(); $('note').focus(); } else go(1);
}
function go(d) { if (view !== 'card') return; const n = idx + d; if (n >= CARDS.length) { view = 'results'; render(); return; } if (n < 0) return; idx = n; startedAt = Date.now(); render(); }
document.querySelectorAll('.v').forEach(b => b.onclick = () => answer(b.dataset.v));
$('prev').onclick = () => go(-1); $('next').onclick = () => go(1);
$('note').addEventListener('input', () => { const c = CARDS[idx], x = answers[c.id] || {}; x.note = $('note').value; if (x.verdict) { x.ms = x.ms || 0; answers[c.id] = x; save(answers); } });
document.addEventListener('keydown', e => {
  if (view !== 'card' || e.target.tagName === 'TEXTAREA') { if (e.target.tagName === 'TEXTAREA' && e.key === 'Escape') e.target.blur(); return; }
  if (e.key === '1') answer('yes'); else if (e.key === '2') answer('no'); else if (e.key === '3') answer('unsure');
  else if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
});
$('bResults').onclick = () => { view = 'results'; render(); };

// one-sided 95% upper bound for a proportion (Clopper-Pearson), by bisection
function upper(k, n) { if (n === 0) return null; if (k >= n) return 1; const cdf = p => { let s = 0, lc = 0; for (let i = 0; i <= k; i++) { if (i > 0) lc += Math.log((n - i + 1) / i); s += Math.exp(lc + i * Math.log(p) + (n - i) * Math.log(1 - p)); } return s; }; let lo = k / n, hi = 1; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; cdf(m) > 0.05 ? lo = m : hi = m; } return hi; }
const pc = x => (x * 100).toFixed(1).replace(/\.0$/, '') + '%';
function results() {
  const groups = {normal: [], control: []};
  CARDS.forEach(c => (c.group.startsWith('control') ? groups.control : groups.normal).push(c));
  const stat = list => { const r = {yes: 0, no: 0, unsure: 0, open: 0}; list.forEach(c => { const a = answers[c.id]; a && a.verdict ? r[a.verdict]++ : r.open++; }); return r; };
  const s = stat(groups.normal), sc = stat(groups.control), answered = s.yes + s.no;
  const ub = upper(s.no, answered);
  const reasons = {}; CARDS.forEach(c => { const a = answers[c.id]; if (a && a.verdict === 'no') (a.reasons || ['(none given)']).forEach(r => reasons[r] = (reasons[r] || 0) + 1); });
  const nameOf = Object.fromEntries(REASONS);
  const bar = (label, g) => { const t = g.yes + g.no + g.unsure + g.open; return '<div class="row"><div>' + label + '</div><div class="track"><i style="width:' + g.yes / t * 100 + '%;background:var(--good)"></i><i style="width:' + g.no / t * 100 + '%;background:var(--bad)"></i><i style="width:' + g.unsure / t * 100 + '%;background:var(--unsure)"></i></div><div>' + (g.yes + g.no + g.unsure) + '/' + t + '</div></div>'; };
  const byGroup = name => { const l = CARDS.filter(c => c.group === name); return l.length ? bar(({changed: 'With changes', nochange: 'No change', 'control-quote': 'Planted: quote contradicts', 'control-id': 'Planted: models pick another record', 'control-nothing': 'Planted: quote says nothing'})[name] || name, stat(l)) : ''; };
  const summary = 'Audit of ' + groups.normal.length + ' cards both models would have let through: ' + s.no + ' wrong out of ' + answered + ' judged' + (answered ? ' (' + pc(s.no / answered) + '; with 95% confidence the true rate is below ' + pc(ub) + ')' : '') + '. Planted cards where the models disagreed: you flagged ' + sc.no + ' of ' + (sc.yes + sc.no + sc.unsure) + ' answered.';
  $('main').innerHTML = '<div class="intro" style="max-width:1100px"><h2>Results</h2><p>' + (answered < 20 ? 'Answer more cards for a meaningful rate. ' : '') + 'Only the cards both models would have approved count toward the error rate.</p>' +
    '<div class="big">' +
      '<div class="stat good"><div class="n">' + s.yes + '</div><div class="t">would let through</div></div>' +
      '<div class="stat bad"><div class="n">' + s.no + '</div><div class="t">wrong</div></div>' +
      '<div class="stat"><div class="n">' + (answered ? pc(s.no / answered) : '–') + '</div><div class="t">error rate in the auto-approvable set</div></div>' +
      '<div class="stat"><div class="n">' + (ub == null ? '–' : '< ' + pc(ub)) + '</div><div class="t">95% upper bound on the true rate</div></div>' +
    '</div>' +
    '<div class="legend"><span><b style="background:var(--good)"></b>correct</span><span><b style="background:var(--bad)"></b>wrong</span><span><b style="background:var(--unsure)"></b>can\'t tell</span></div>' +
    byGroup('changed') + byGroup('nochange') + byGroup('control-quote') + byGroup('control-id') + byGroup('control-nothing') +
    (s.no ? '<h3>What was wrong</h3>' + Object.entries(reasons).map(([k, v]) => '<div class="row"><div>' + esc(nameOf[k] || k) + '</div><div class="track"><i style="width:' + v / s.no * 100 + '%;background:var(--bad)"></i></div><div>' + v + '</div></div>').join('') : '') +
    '<h3>One line for a slide</h3><pre id="sum">' + esc(summary) + '</pre><p><button class="ghost" id="cp">Copy</button> <button class="ghost" id="ex2">Export CSV</button> <button class="ghost" id="back">Back to cards</button> <button class="ghost" id="reset">Clear all answers</button></p></div>';
  $('cp').onclick = () => { try { navigator.clipboard.writeText(summary); } catch (e) {} };
  $('ex2').onclick = exportCsv; $('back').onclick = () => { view = 'card'; render(); };
  $('reset').onclick = () => { if (confirm('Clear all ' + Object.keys(answers).length + ' answers?')) { answers = {}; save(answers); view = 'intro'; render(); } };
}
function exportCsv() {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = [['card_id', 'group', 'entity', 'record', 'verdict', 'reasons', 'note', 'seconds']].concat(CARDS.map(c => { const a = answers[c.id] || {}; return [c.id, c.group, c.entityEn || c.entity, c.record.name, a.verdict || '', (a.reasons || []).join('|'), a.note || '', a.ms ? Math.round(a.ms / 1000) : '']; }));
  const csv = rows.map(r => r.map(q).join(',')).join('\n');
  try { const blob = new Blob(['﻿' + csv], {type: 'text/csv'}); const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = 'audit-answers.csv'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); }
  catch (e) { view = 'results'; render(); $('main').insertAdjacentHTML('beforeend', '<div class="intro"><p>Download was blocked. Copy this:</p><pre>' + esc(csv) + '</pre></div>'); }
}
$('bExport').onclick = exportCsv;
render();
</script>
