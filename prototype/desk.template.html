<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review desk: every current card, new design</title>
<style>
  :root{
    --bg:#F4F1EA; --ink:#1C2333; --ink2:#47506A; --ink3:#66708A; --line:#DDD8CB;
    --accent:#2F5BEA; --accent-bg:#E8EEFF;
    --paper:#FFFFFF; --news:#F3EFE5; --news-ink:#1F1B16; --news-soft:#5A5248; --rule:#E6E1D4;
    --tick:#2E7A4A; --cross:#B3322B; --add:#1F6B3F; --add-bg:#E3F2E6; --del:#9A3B32; --del-bg:#F8E1DE;
    --go:#1F7A46; --no:#C2352D; --grey:#4F5864; --amber:#7A4E06; --amber-bg:#FBE8C8; --amber-line:#C98A1B;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Inter","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  button,select,input,textarea{font:inherit}
  button{cursor:pointer}
  button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  /* not part of the design: moving between the cards of the prototype */
  .proto{position:sticky;top:0;z-index:30;background:#15110e;color:#cfc6b8;font-size:.8rem;padding:.45rem 1rem;display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
  .proto b{color:#fff;margin-right:.2rem}
  .proto button,.proto select{background:#2b2420;color:#eee;border:1px solid #5a4e44;border-radius:4px;padding:.2rem .6rem;font-size:.78rem;max-width:18rem}
  .proto button.on{background:#e9e1d4;color:#15110e}
  .proto .sp{flex:1}


  .mast{display:flex;justify-content:space-between;align-items:center;gap:.4rem 1rem;flex-wrap:wrap;padding:1rem 0 .7rem}
  .mast b{font-size:1.15rem;letter-spacing:-.01em}
  .mast .what{color:var(--ink3);font-size:.92rem;margin-left:.4rem}
  .mast .right{display:flex;align-items:center;gap:.8rem;color:var(--ink3);font-size:.9rem}
  .helpbtn{background:var(--paper);border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:.25rem .8rem;font-size:.85rem;font-weight:600}
  .progress{height:6px;background:#E4DFD2;border-radius:999px;overflow:hidden;margin-bottom:.4rem}
  .progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .3s}

  .steps{list-style:none;display:flex;gap:.5rem 1rem;align-items:center;margin:1.2rem 0 .3rem;padding:0;flex-wrap:wrap}
  .steps li{display:flex;align-items:center;gap:.5rem;color:var(--ink3);font-size:.95rem}
  .steps .n{width:1.6rem;height:1.6rem;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:.8rem;font-weight:700}
  .steps li.now{color:var(--ink);font-size:1.3rem;font-weight:750}
  .steps li.now .n{width:2.2rem;height:2.2rem;background:var(--accent);color:#fff;border-color:var(--accent);font-size:1rem}
  .steps li.done{color:var(--ink2)}
  .steps li.done .n{background:var(--tick);border-color:var(--tick);color:#fff}
  .steps .bar{width:2rem;height:2px;background:var(--line)}
  .segs{display:inline-flex;gap:.25rem;margin-left:.4rem}
  .segs i{width:1.5rem;height:.5rem;border-radius:3px;background:#D9D4C7}
  .segs i.on{background:var(--accent)} .segs i.done{background:var(--tick)}
  .dots{display:inline-flex;gap:.3rem;vertical-align:middle;margin:0 .3rem}
  .dots i{width:.6rem;height:.6rem;border-radius:50%;background:#D9D4C7}
  .dots i.on{background:var(--accent)}

  h1{font-size:1.55rem;line-height:1.25;margin:.5rem 0 1rem;font-weight:750;letter-spacing:-.015em;overflow-wrap:anywhere}
  .flag{margin:-.4rem 0 .9rem;padding:.5rem .8rem;border-left:4px solid var(--amber-line);background:var(--amber-bg);color:#4a3205;border-radius:0 8px 8px 0;font-size:.92rem}

  .focus{background:var(--paper);color:var(--ink);border-radius:16px;overflow:hidden;border:1px solid var(--rule);box-shadow:0 1px 2px rgba(20,25,40,.05),0 10px 30px rgba(20,25,40,.09)}
  .side{padding:1.05rem 1.3rem}
  .side.news{background:var(--news);color:var(--news-ink)}
  .label{display:flex;justify-content:space-between;gap:.2rem .6rem;flex-wrap:wrap;font-size:.74rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.4rem;color:var(--ink2)}
  .side.news .label{color:var(--news-ink)}
  /* The outlet line always has its own row: sharing the first one, it fitted for CNA and wrapped for The Straits Times, and the source buttons jumped from beside the label to the far right as you clicked through them. */
  .side.news .label .src{flex-basis:100%}
  .label .src{font-weight:500;letter-spacing:.02em;text-transform:none;color:var(--news-soft);font-size:.82rem}
  .side.tte .label .src,.draftbox .label .src{color:var(--ink3)}
  .label a,.hl a{color:inherit}
  .label .src a{color:var(--accent);background:#fff;border:1.5px solid var(--accent);border-radius:999px;padding:.02rem .6rem;text-decoration:none;font-weight:650;font-size:.8rem}
  .hl{font-size:.82rem;color:var(--news-soft);margin:-.1rem 0 .45rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hl mark{font-size:inherit}
  blockquote{margin:0;font:1.2rem/1.45 Newsreader,Georgia,"Times New Roman",serif;overflow-wrap:anywhere}
  .tr{margin:.45rem 0 0;font:.98rem/1.45 Newsreader,Georgia,serif;color:var(--news-soft);overflow-wrap:anywhere}
  mark{background:#FBDD6A;color:inherit;padding:0 .12em;border-radius:3px}
  mark.v{background:#BFE3C8;box-shadow:0 0 0 1px #2E7A4A inset}
  .pills{display:inline-flex;gap:.25rem;margin-left:.3rem;vertical-align:middle}
  .pills button{border:1.5px solid #BDB6A4;background:#fff;color:var(--news-ink);border-radius:999px;width:1.6rem;height:1.6rem;font-size:.78rem;font-weight:700;padding:0}
  .pills button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pills button.lg{width:auto;min-width:1.6rem;padding:0 .45rem}
  .pills button small{font-size:.66rem;font-weight:700;margin-left:.2rem;opacity:.75}
  .join{display:flex;align-items:center;gap:.7rem;padding:.4rem 1.3rem;background:var(--paper);color:var(--ink3);font-size:.78rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase;border-top:1px solid var(--rule)}
  .join::before,.join::after{content:"";flex:1;height:1px;background:var(--rule)}
  .side.tte{padding-top:.7rem}
  .name{margin:.1rem 0 .1rem;font-size:1.55rem;line-height:1.2;overflow-wrap:anywhere;letter-spacing:-.01em}
  .ident{margin:0 0 .75rem;color:var(--ink2);font-size:.98rem;overflow-wrap:anywhere}
  .npt{margin:-.4rem 0 .7rem;color:var(--ink3);font-size:.86rem}
  .checks{list-style:none;margin:0 0 .5rem;padding:0;display:grid;gap:.4rem}
  .checks li{display:grid;grid-template-columns:5.8rem 1fr;gap:.6rem;align-items:baseline;font-size:.96rem;padding:.4rem .7rem;border-radius:8px;background:#F7F5EF;overflow-wrap:anywhere}
  .checks b{font-weight:700;white-space:nowrap}
  .checks .ok b{color:var(--tick)} .checks .bad b{color:var(--cross)} .checks .none b,.checks .part b{color:var(--ink3)}
  .checks .ok{border-left:4px solid var(--tick)} .checks .bad{border-left:4px solid var(--cross)}
  .checks .none{border-left:4px solid var(--line)} .checks .part{border-left:4px solid var(--amber-line)}
  .checks small{display:block;color:var(--ink3);font-size:.82rem}
  .more{background:none;border:none;color:var(--accent);text-decoration:underline;padding:.2rem 0;font-size:.88rem;margin-right:1rem}
  .full{margin:.5rem 0 0;padding:.6rem 0 0;border-top:1px solid var(--rule);font-size:.9rem;display:grid;gap:.35rem}
  .full div{display:grid;grid-template-columns:8rem 1fr;gap:.6rem;overflow-wrap:anywhere}
  .full .k{color:var(--ink3);font-weight:600}
  .full .nv{display:grid;gap:.15rem}
  .full .nvi{display:flex;justify-content:space-between;align-items:baseline;gap:.2rem .6rem;flex-wrap:wrap}
  .full .nvi.out>span:first-child{text-decoration:line-through;opacity:.5}
  .full .nvi small{color:var(--tick)} .full .nvi small.nt{color:var(--amber)}
  .full .nvi .x{background:none;border:none;color:var(--ink3);font-size:1.05rem;line-height:1;padding:0 .2rem}
  .full .nvi .vtags{margin-left:auto}
  .cands{margin:.9rem 0 0;color:var(--ink2);font-size:.9rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
  .cands button{background:var(--paper);border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:.2rem .75rem;font-size:.86rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cands button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tt{display:inline-block;font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:0 .3rem;margin-left:.4rem;opacity:.8;vertical-align:middle}
  .frow{display:flex;gap:.5rem} .frow input{flex:1} .frow select{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:.4rem .6rem;font-size:.9rem;color:var(--ink)}
  .ctype{font:inherit;font-size:.78rem;font-weight:650;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:.15rem .4rem;color:var(--ink);text-transform:none;letter-spacing:0}
  .cands button.newrec{border-style:dashed;color:var(--ink2)}

  .ba{padding:1rem 1.3rem 1.2rem;display:grid;gap:.75rem}
  .ba .row{display:grid;gap:.3rem}
  .tag{font-size:.74rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
  .was{color:var(--ink2);font-size:1rem;overflow-wrap:anywhere}
  .was em{font-style:normal;opacity:.75}
  .was s{text-decoration-color:var(--del);text-decoration-thickness:2px}
  .arrow{display:flex;align-items:center;gap:.6rem;color:var(--ink2);font-size:.8rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase}
  .arrow .ln{flex:1;height:1px;background:var(--rule)}
  .editbtn{background:#fff;color:var(--ink);border:1.5px solid var(--ink3);border-radius:8px;padding:.25rem .8rem;font-size:.86rem;font-weight:650;letter-spacing:0;text-transform:none}
  .editbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .vrows{display:grid;gap:.45rem}
  .vrow{display:flex;justify-content:space-between;align-items:center;gap:.4rem .8rem;flex-wrap:wrap;padding:.55rem .75rem;border-radius:10px;border:1.5px solid var(--add);background:var(--add-bg);color:var(--add)}
  .vrow.new{border-color:var(--amber-line);background:var(--amber-bg);color:var(--amber)}
  .vrow.out{opacity:.5} .vrow.out .vmain b{text-decoration:line-through}
  .vmain{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;font-size:1rem;overflow-wrap:anywhere}
  .vmain b{font-weight:650}
  .plus{font-weight:800}
  .vtags{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
  .vtags small{font-weight:750;font-size:.66rem;letter-spacing:.06em;border:1px solid currentColor;border-radius:4px;padding:.05rem .3rem;opacity:.9;text-transform:uppercase}
  .vrow .x{background:none;border:none;color:inherit;font-size:1.15rem;line-height:1;padding:0 .2rem;opacity:.7}
  .ref{border:1px solid currentColor;background:transparent;color:inherit;border-radius:50%;width:1.25rem;height:1.25rem;font-size:.68rem;font-weight:700;opacity:.85;padding:0}
  .cin{font:inherit;font-weight:600;color:var(--ink);background:#fff;border:1.5px solid currentColor;border-radius:6px;padding:.25rem .5rem;flex:1;min-width:8rem}
  .addchip{justify-self:start;background:none;border:1.5px dashed var(--ink3);color:var(--ink2);border-radius:999px;padding:.3rem .9rem;font-size:.92rem}
  .desc{font-size:1.02rem;line-height:1.6;overflow-wrap:anywhere}
  .desc .add{background:var(--add-bg);color:var(--add);border-radius:4px;padding:.05rem .2rem;font-weight:600}
  .desc del{background:var(--del-bg);color:var(--del);border-radius:4px;padding:.05rem .2rem;text-decoration-thickness:2px}
  .desc .fade{color:var(--ink2)} .desc .gap{color:var(--ink3);font-weight:700}
  .dta{width:100%;font:1rem/1.55 inherit;font-family:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--ink3);border-radius:10px;padding:.6rem .7rem;min-height:9rem}
  .final{font-size:1.02rem;line-height:1.65;overflow-wrap:anywhere;padding:.55rem .75rem;border-radius:10px;background:#F7F5EF;border:1px solid var(--rule)}
  .final .old{color:var(--ink2)}
  .final .newv{background:var(--add-bg);color:var(--add);border-radius:5px;padding:.05rem .35rem;font-weight:650}
  .final .newv.nt{background:var(--amber-bg);color:var(--amber)}
  .dparts{display:flex;gap:.6rem;flex-wrap:wrap} .dparts label{display:grid;gap:.2rem;font-size:.75rem;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
  .dparts .din{font:inherit;font-size:1rem;font-weight:600;color:var(--ink);background:#fff;border:1.5px solid var(--ink3);border-radius:6px;padding:.3rem .5rem;width:4.5rem}
  .dparts label:last-child .din{width:5.5rem}
  .seg2{display:inline-flex;background:#E9E5D9;border-radius:8px;padding:.15rem}
  .seg2 button{border:none;background:none;border-radius:6px;padding:.22rem .7rem;font-size:.84rem;font-weight:650;color:var(--ink2);letter-spacing:0;text-transform:none}
  .seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,25,40,.18)}
  .alts{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;font-size:.88rem;color:var(--ink2)}
  .alts button,.pick{background:#fff;border:1.5px solid var(--ink3);color:var(--ink);border-radius:8px;padding:.3rem .65rem;font-size:.88rem;text-align:left}
  .picks{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.35rem}
  .pick.on{background:var(--ink);color:#fff}
  .warn{padding:.55rem .8rem;border-left:4px solid var(--cross);background:var(--del-bg);color:#5a1f1a;border-radius:0 8px 8px 0;font-size:.92rem}
  .note{padding:.55rem .8rem;border-left:4px solid var(--amber-line);background:var(--amber-bg);color:#4a3205;border-radius:0 8px 8px 0;font-size:.92rem}
  .side.news.small{padding:.85rem 1.3rem}
  .side.news.small blockquote{font-size:1.08rem}
  .find{margin:.6rem 0 0;display:grid;gap:.4rem}
  .find input{padding:.55rem .8rem;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);width:100%}
  .hits{display:grid;gap:.3rem;max-height:18rem;overflow:auto}
  .hit{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:.45rem .75rem}
  .hit small,.hit .npt2{color:var(--ink3);font-size:.8rem}
  .nohits{color:var(--ink3);font-size:.9rem}
  .draftbox{padding:1rem 1.3rem}
  .draftbox .orig{color:var(--ink2);font-size:.95rem;margin:0 0 .6rem}
  .focus .draftbox{background:repeating-linear-gradient(135deg,#fff,#fff 10px,#FAF8F2 10px,#FAF8F2 20px)}

  .actions{position:sticky;bottom:0;margin:1.1rem 0 0;padding:.9rem 0;background:linear-gradient(rgba(244,241,234,0),var(--bg) 30%);display:grid;gap:.55rem}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
  .stamp{border:2px solid;border-radius:12px;padding:.8rem .95rem;text-align:left;display:grid;gap:.12rem;min-height:4.2rem;align-content:center;box-shadow:0 2px 6px rgba(20,25,40,.12);transition:transform .08s}
  .stamp:active{transform:translateY(1px)}
  .stamp b{font-size:1.1rem;font-weight:750;letter-spacing:-.005em}
  .stamp span{font-size:.86rem;line-height:1.3;opacity:.92}
  .stamp.go{background:var(--go);border-color:var(--go);color:#fff}
  .stamp.red{background:var(--no);border-color:var(--no);color:#fff}
  .stamp.grey{background:#fff;border-color:#B8BFC9;color:var(--grey)}
  .quiet{justify-self:start;background:none;border:none;color:var(--ink2);text-decoration:underline;padding:.2rem 0;font-size:.92rem}
  .qrow{display:flex;gap:1.2rem;flex-wrap:wrap}
  .done-card{background:var(--paper);color:var(--ink);border-radius:16px;padding:1.6rem 1.4rem;display:grid;gap:.7rem;border:1px solid var(--rule);box-shadow:0 10px 30px rgba(20,25,40,.09);justify-items:start}
  .done-card h2{margin:0;font-size:1.4rem} .done-card p{margin:0;color:var(--ink2)}
  .bigtick{width:3.2rem;height:3.2rem;border-radius:50%;background:var(--tick);color:#fff;display:grid;place-items:center;font-size:1.7rem;font-weight:800;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  .bigtick.keep{background:var(--amber-line)}
  @keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}

  /* first open: what this is, in one picture */
  .veil{position:fixed;inset:0;background:rgba(20,25,40,.55);display:grid;place-items:center;z-index:50;padding:1rem;overflow:auto}
  .welcome{background:#fff;color:var(--ink);border-radius:20px;max-width:50rem;width:100%;padding:1.7rem 1.7rem 1.5rem;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .welcome h2{margin:0 0 .2rem;font-size:1.6rem;line-height:1.2;letter-spacing:-.015em}
  .welcome .sub{margin:0;color:var(--ink2)}
  .flow{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin:1.4rem 0 1.1rem;counter-reset:f}
  .fstep{border:1.5px solid var(--rule);border-radius:14px;padding:.9rem .9rem 1rem;background:#FAF8F3;position:relative;display:grid;gap:.35rem;align-content:start}
  .fstep:not(:last-child)::after{content:"\2192";position:absolute;right:-.95rem;top:2.2rem;color:var(--ink3);font-size:1.1rem;z-index:1}
  .fstep svg{width:2.4rem;height:2.4rem;color:var(--ink2)}
  .fstep b{font-size:1rem}
  .fstep span{font-size:.86rem;color:var(--ink2);line-height:1.35}
  .fstep.you{background:var(--accent-bg);border-color:var(--accent)}
  .fstep.you svg{color:var(--accent)}
  .fstep.you em{position:absolute;top:-.7rem;left:.8rem;background:var(--accent);color:#fff;font-style:normal;font-size:.7rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:.12rem .6rem}
  .welcome .foot{margin:0 0 1.1rem;color:var(--ink3);font-size:.86rem}
  .welcome .go{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:.8rem 1.6rem;font-size:1.05rem;font-weight:700}
  @media (max-width:42rem){
    .flow{grid-template-columns:1fr}
    .fstep:not(:last-child)::after{content:"\2193";right:auto;left:1.2rem;top:auto;bottom:-1.15rem}
  }
  .mast .right{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
  .work{display:flex;align-items:center;gap:.4rem;font-size:.85rem;color:var(--ink3)}
  .work select{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:.27rem .7rem;font-size:.88rem;color:var(--ink);font-weight:650}
  .navbtn{background:var(--paper);border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:.3rem .85rem;font-size:.86rem;font-weight:650}
  .navbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .menu{position:relative}
  .menu summary{list-style:none;cursor:pointer;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;width:2.1rem;height:2.1rem;display:grid;place-items:center;font-size:1.1rem;line-height:1}
  .menu summary::-webkit-details-marker{display:none}
  .menu-panel{position:absolute;right:0;top:calc(100% + .35rem);z-index:20;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,25,40,.18);padding:.3rem;min-width:11rem;display:grid}
  .menu-panel button{background:none;border:none;text-align:left;padding:.5rem .7rem;border-radius:8px;font-size:.92rem;color:var(--ink)}
  .menu-panel button:hover{background:#F3F0E8}
  .progline{display:flex;justify-content:flex-end;color:var(--ink3);font-size:.85rem;margin:-.05rem 0 0}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin:.8rem 0}
  .tile{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:.9rem 1rem;box-shadow:0 1px 2px rgba(20,25,40,.05);display:grid;gap:.1rem}
  .tile b{font-size:1.9rem;line-height:1.1;letter-spacing:-.02em}
  .tile span{color:var(--ink2);font-size:.86rem}
  .minor{color:var(--ink3);font-size:.9rem;margin:.3rem 0 1rem}
  .h2{font-size:1.15rem;margin:1.4rem 0 .5rem}
  .filters{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 .7rem}
  .filters select,.filters input{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:.4rem .7rem;font-size:.9rem;color:var(--ink)}
  .filters input{flex:1;min-width:10rem}
  .focus.sheet{padding:.3rem 0}

<script>

const asReplace = ch => ch.strategy === "APPEND" && SCALAR(ch.field) ? { ...ch, strategy: "REPLACE", verb: "Replace" } : ch;
const modeOf = (st, k, ch) => st.mode[k] || (ch.strategy === "REPLACE" ? "replace" : "add");
// A Chinese name confirmed against a record TTE holds only in English is a non-English name TTE lacks. It is asked as
// a change like any other, not added to the sheet unseen, and not asked at all when TTE already holds that name.
// Called a non-English name, as the cataloguers call it, so only the record's names in another script are shown
// beside it: an English variant ("LTA") is not one, and Replace would not remove it.
const plainName = n => String(n || "").replace(/[\s()（）]/g, "");
const nonLatin = n => /[^\u0000-\u024F\u1E00-\u1EFF\u2000-\u206F]/.test(n);
let NPT_READY = !ONLINE;   // online, the variant names arrive with the search index, a moment after the deck
function variantRow(c, o) {
  if (!o || !NPT_READY || !CJK.test(c.entity) || CJK.test(o.name)) return null;
  const held = (NPT[o.uid] || []).concat(o.npt ? [o.npt] : []);
  if (held.some(n => plainName(n) === plainName(c.entity))) return null;
  const zh = c.sources.find(s => langOf(s.link || "") === "zh") || c.sources[0] || {};
  return { field: "Non-English name", strategy: "APPEND", verb: "Add", adding: c.entity, existing: [...new Set(held.filter(nonLatin))], result: c.entity, from: zh.link || "", variant: true };
}
const rowsFor = (c, o) => o ? mergeDates(mergeRows((reopened(c) ? [] : (o.extra || [])).concat(o.uid === c.picked ? onlyNew(c, c.changes) : []).map(asReplace).map(asProse)), o, c).concat((!reopened(c) && variantRow(c, o)) || []) : [];
const chosenOpt = (c, st) => ordered(c)[st.chosen != null ? st.chosen : st.cand];
let NAMEIDX = null;
const idxHas = v => { if (!NAMEIDX) NAMEIDX = new Set(INDEX.map(r => normVal(r[1]))); return NAMEIDX.has(normVal(v)); };

const stepper = (mode, c, st) => {
  if (mode === "create" || mode === "endnew") return "";
  const nCh = rowsFor(c, mode === "who" ? ordered(c)[st.cand] : chosenOpt(c, st)).length;
  const dot = (cls, n, text, extra) => `<li class="${cls}"><span class="n">${cls === "done" ? "&#10003;" : n}</span> ${text}${extra || ""}</li>`;
  const segs = `<span class="segs">${Array.from({ length: nCh }, (_, i) => `<i class="${i < st.ch ? "done" : i === st.ch ? "on" : ""}"></i>`).join("")}</span>`;
  const first = mode === "who" ? dot("now", 1, "Same record?") : dot("done", 1, "Same record?");
  const second = nCh ? dot(mode === "change" ? "now" : mode === "done" ? "done" : "", 2, "Changes", mode === "change" && nCh > 1 ? segs : "") : "";
  return `<ol class="steps">${first}${second ? `<li class="bar" aria-hidden="true"></li>${second}` : ""}</ol>`;
};
const stamp = (a, cls) => `<button class="stamp ${cls}" data-act="${a[0]}"><b>${a[1]}</b>${a[2] ? `<span>${a[2]}</span>` : ""}</button>`;
const actions = (a, b, quiet) => `<div class="actions"><div class="pair">${stamp(a, a[3] || "go")}${stamp(b, b[3] || "grey")}</div>
  <div class="qrow">${quiet.map(q => `<button class="quiet" data-act="${q[0]}">${q[1]}</button>`).join("")}</div></div>`;

// search: every record of the card's type, ranked as the desk ranks it
function hitsHtml(c, query) {
  const nz = t => String(t || "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").trim();
  const q = nz(query);
  if (q.length < 2) return `<div class="nohits">Type at least two letters.</div>`;
  const have = new Set(ordered(c).map(o => o.uid));
  const wordStart = new RegExp("(^|\\s)" + reEsc(q), "u");
  const starts = t => wordStart.test(nz(t)), has = t => nz(t).includes(q);
  const via = {};
  const byNpt = test => row => { const n = (NPT[row[0]] || []).find(test); if (n) via[row[0]] = n; return !!n; };
  const passes = [r => starts(r[1]), byNpt(starts), r => has(r[1]), byNpt(has), r => starts(r[3]) || starts(r[4]), r => has(r[3]) || has(r[4])];
  const found = []; let listed = 0;
  const only = (S[c.key] || {}).stype || "all";
  for (const pass of passes) for (const r of INDEX) {
    if (found.length >= 80) break;
    if ((only !== "all" && r[2] !== only) || found.includes(r)) continue;
    if (pass(r)) { if (have.has(r[0])) { listed++; continue; } found.push(r); }
  }
  found.sort((a, b) => (b[2] === c.type) - (a[2] === c.type));
  if (!found.length) return `<div class="nohits">${listed ? "That record is already one of the candidates above." : "No record by that name."}</div>`;
  return found.slice(0, 25).map(r => `<button class="hit" data-act="pickhit" data-u="${esc(r[0])}" data-npt="${esc(via[r[0]] || "")}"><b>${esc(r[1])}</b><span class="tt">${esc(kind({ type: r[2] }))}</span>${via[r[0]] ? `<span class="npt2">NPT ${esc(via[r[0]])}</span>` : ""}${r[3] ? `<small>${esc(gist(r[3], 60))}</small>` : ""}</button>`).join("");
}
const candRow = (c, st, label) => {
  const opts = ordered(c);
  return `<div class="cands">${opts.length ? label : "Not in the list?"} ${opts.map((o, i) => `<button class="${st.screen === "who" && i === st.cand ? "on" : ""}" data-act="cand" data-i="${i}">${esc(o.name)}${typeTag(c, o)}</button>`).join("")}
    <button data-act="find">${st.finding ? "Close search" : "Search TTE"}</button>${st.screen === "who" ? `<button class="newrec" data-act="newrec">+ New record</button>` : ""}</div>
  ${st.finding ? `<div class="find"><div class="frow"><input id="q" type="search" autocomplete="off" placeholder="Search every record in TTE by name, occupation or description" value="${esc(st.query || "")}"><select id="qt" aria-label="Record type"><option value="all">All types</option>${Object.keys(TYPES).map(t => `<option value="${t}" ${st.stype === t ? "selected" : ""}>${TYPES[t][0]}</option>`).join("")}</select></div><div class="hits" id="hits">${hitsHtml(c, st.query)}</div></div>` : ""}`;
};

// ---- screens ---------------------------------------------------------------------
// A search result carries an identity line and the opening of the description; the two often start the same way.
const thinIdent = o => { const d = gist((fieldMap(o.fields)).Description, 120), id = o.ident || ""; return [id && !d.startsWith(id.replace(/…$/, "").trim()) ? id : "", d].filter(Boolean).join(" · "); };
function who(c, st) {
  const opts = ordered(c), o = opts[st.cand];
  if (!o) return create(c, st);
  const nCh = rowsFor(c, o).length;
  const rows = checks(c, o);
  return `${stepper("who", c, st)}
  <h1>Is this TTE record the same ${esc(kind(c))} as the one in the news?</h1>
  ${c.isFlag && c.flagWhy ? `<p class="flag">${esc(c.flagWhy)}.</p>` : ""}
  <section class="focus">
    ${news(c, st)}
    <div class="join">same ${esc(kind(c))}?</div>
    <div class="side tte">
      <div class="label">In TTE now <span class="src">${esc(o.rtype || c.type)} &middot; no. ${esc(o.uid)}</span></div>
      <h2 class="name">${esc(o.name)}</h2>
      <p class="ident">${esc(o.thin ? thinIdent(o) || "Nothing recorded but its name" : identLine(c, o))}</p>
      ${o.npt ? `<p class="npt">Found through the name &ldquo;${esc(o.npt)}&rdquo;</p>` : ""}
      <ul class="checks">${rows.map(r => `<li class="${r.k}"><b>${r.label}</b><span>${r.text}${r.sub ? `<small>${esc(r.sub)}</small>` : ""}</span></li>`).join("")}</ul>
      ${o.thin ? `<p class="npt">Only the name and the start of the description are shown for a search result.</p>` : `<button class="more" data-act="full">${st.full ? "Hide the full record &#9652;" : "Show the full record &#9662;"}</button>`}
      ${st.full && !o.thin ? `<div class="full">${(o.fields.length ? o.fields : [{ key: "", value: "Nothing recorded" }]).map(x => `<div><span class="k">${esc(x.key)}</span><span>${esc(x.value)}</span></div>`).join("")}</div>` : ""}
    </div>
  </section>
  ${candRow(c, st, "Records it could be:")}
  ${actions(["same", `Same record${nCh ? ` (${nCh} change${nCh > 1 ? "s" : ""})` : ""}`, nCh ? "" : "already up to date", "go"],
            ["discard", "No thanks", "discard this one", "red"],
            quiet(st))}`;
}

// A field of a record to create, value by value. Every value goes on the sheet unless the reviewer leaves it out
// with ×: the cataloguer types the record from the sheet, so a value the reviewer knows is wrong must not reach it.
const fieldVals = f => String(f.value || "").split(" | ").filter(v => v.trim());
const leftOutOf = (c, st) => c.newsFields.flatMap((f, fi) => fieldVals(f).filter((v, vi) => st.out["n" + fi + ":" + vi]).map(value => ({ field: f.key, value })));
const keptFields = (fields, out) => (fields || []).map(f => ({ ...f, value: fieldVals(f).filter(v => !(out || []).some(o => o.field === f.key && o.value === v)).join(" | ") }))
  .filter(f => f.value);
// A field naming other records (awards, affiliations, parent organisation, founder) says of each name whether TTE
// has it, as a change to a record does; the card builder has already written a name TTE holds as TTE writes it.
function newField(c, st, x) {
  const fi = c.newsFields.indexOf(x), flags = (c.newsLinked || {})[x.key];
  const linked = new Set((flags || []).filter(f => f.uid).map(f => f.name));
  const vals = fieldVals(x).map((v, vi) => {
    const out = st.out["n" + fi + ":" + vi];
    const tag = flags ? (linked.has(v) || idxHas(v) ? "<small>in TTE</small>" : `<small class="nt">not in TTE</small>`) : "";
    return `<span class="nvi ${out ? "out" : ""}"><span>${esc(gist(v, st.full ? 400 : 90))}</span><span class="vtags">${tag}<button class="x" data-act="nout" data-i="${fi}" data-j="${vi}" title="${out ? "Put back" : "Leave out"}">${out ? "&#8634;" : "&times;"}</button></span></span>`;
  }).join("");
  return `<div><span class="k">${esc((FACTS.find(f => f[0] === x.key) || [0, x.key])[1])}</span><span class="nv">${vals}</span></div>`;
}

function create(c, st) {
  const name = c.entityEn ? `${c.entity} (${c.entityEn})` : c.entity;
  const fresh = c.isNew;
  const nf = c.newsFields.filter(f => f.key !== "Description"), desc = fieldMap(c.newsFields)["Description"];
  const shown = st.full ? nf : nf.slice(0, 5);
  return `<h1>${esc(fresh ? name + " is not in TTE. Create a record?" : "No record for " + name + ". Create one?")}</h1>
  <section class="focus">
    ${news(c, st)}
    <div class="join">would become a new record</div>
    <div class="draftbox">
      <div class="label">If you create it <span class="src"><select class="ctype" id="ctype" aria-label="Record type">${Object.keys(TYPES).map(t => `<option value="${t}" ${(st.ctype || c.type) === t ? "selected" : ""}>${TYPES[t][0].replace(/ \(.*\)/, "")}${t === "FACILITY" ? " (building)" : t === "LOCATION" ? " (place)" : ""}</option>`).join("")}</select> &middot; new record</span></div>
      <h2 class="name">${esc(c.entityEn || c.entity)}</h2>
      ${c.entityEn && c.entity !== c.entityEn ? `<p class="orig">${esc(c.entity)}</p>` : ""}
      ${desc ? `<p class="ident">${esc(st.full ? desc : gist(desc, 170))}</p>` : ""}
      ${shown.length ? `<div class="full" style="border-top:none;padding-top:0">${shown.map(x => newField(c, st, x)).join("")}</div>` : ""}
      ${nf.length > 5 || (desc && desc.length > 170) ? `<button class="more" data-act="full">${st.full ? "Show less &#9652;" : "Show more &#9662;"}</button>` : ""}
    </div>
  </section>
  ${candRow(c, st, c.isNew ? "Nearest in TTE (the model matched none):" : "Records it could be:")}
  ${actions(["create", "Create a new record", "goes on the sheet", "go"], ["noworth", "Not worth a record", "nothing is created", "red"],
            quiet(st))}`;
}

const TYPES = { PERSON: ["People", "People"], ORGANISATION: ["Organisations", "Organisations"], FACILITY: ["Facilities (buildings)", "Geobuildings"], LOCATION: ["Locations (places)", "Geographics"],
                EVENT: ["Events", "Events"], AWARD: ["Awards", "Awards"], PROGRAMME: ["Programmes", "Programmes"], LEGAL_ACT: ["Legal acts", "Legal acts"] };
const FIELD_Q = { "Description": "the description", "Title": "the title", "Affiliations(groupName)": "the affiliations", "Awards": "the awards", "Occupation": "the occupation",
                  "Parent Organisation": "the parent organisation", "Achievements": "the achievements", "Year Ended (yyyy)": "the year ended",
                  "Month Ended (mm)": "the month ended", "Day Ended (dd)": "the day ended", "Death Day (dd)": "the day of death", "Child": "the children" };
const fq = f => FIELD_Q[f] || f.replace(/\s*\(.*\)$/, "").toLowerCase();
// The field's name where the value is read, not only in the question above it: "01 → 16" under "In TTE now" left a
// reviewer asking which field it was (Feedback 3).
const fieldLabel = f => { const n = fq(f).replace(/^the /, ""); return n.charAt(0).toUpperCase() + n.slice(1); };
// A date is three TTE fields, day, month and year, and the builder proposes each on its own. Asked one at a time,
// "Set day started to this? 01 → 16" said neither which date it was nor that the month came next (Feedback 3), and
// accepting the day without the month makes a date no source gives. So the parts of one date are one change: the
// whole date as TTE holds it, and as it would be, with the parts the news does not give kept from TTE, in grey.
// Accepted, each part that changes is still written as its own field, as TTE stores it.
// An event's date is plain "Day", "Month" and "Year".
const DATE_PART = /^(?:(Day|Month|Year) (Started|Ended|Completed)|(Birth|Death) (Day|Month|Year)) \((?:dd|mm|yyyy)\)$|^(Day|Month|Year)$/;
const PARTS = ["Day", "Month", "Year"], PART_FMT = { Day: "dd", Month: "mm", Year: "yyyy" };
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DATE_NAME = { Started: "Date started", Ended: "Date ended", Completed: "Date completed", Birth: "Date of birth", Death: "Date of death", Event: "Event date" };
const partField = (d, p) => d.which === "Event" ? p : d.born ? `${d.which} ${p} (${PART_FMT[p]})` : `${p} ${d.which} (${PART_FMT[p]})`;
const showPart = (p, v) => !v ? "" : p === "Day" ? String(+v || v) : p === "Month" ? (MON[+v - 1] || v) : v;
const showDate = parts => PARTS.map(p => showPart(p, parts[p])).filter(Boolean).join(" ");
function mergeDates(rows, o, c) {
  const out = [], at = new Map();
  rows.forEach(ch => {
    const m = DATE_PART.exec(ch.field || "");
    if (!m || ch.diff) { out.push(ch); return; }
    const which = m[2] || m[3] || "Event", part = m[1] || m[4] || m[5];
    if (!at.has(which)) {
      at.set(which, out.length);
      out.push({ field: DATE_NAME[which], strategy: "REPLACE", verb: "Replace", date: { which, born: !!m[3], held: {}, news: {} },
                 supporters: [], saidBy: [], from: ch.from || (c.newsFrom || {})[ch.field] });
    }
    const d = out[at.get(which)];
    d.date.news[part] = splitVals(ch.adding).filter(v => v.trim()).pop() || "";
    d.date.held[part] = (ch.existing || []).slice(-1)[0] || "";
    d.supporters = [...new Set([...d.supporters, ...(ch.supporters || [])])];
    if (ch.quotes) d.quotes = { ...ch.quotes, ...(d.quotes || {}) };
    d.saidBy = d.saidBy.concat((ch.saidBy || []).map(x => ({ ...x, part })));
    d.split = d.split || !!ch.conflict;
  });
  out.forEach(d => {
    if (!d.date) return;
    // the parts no proposal touches, as TTE holds them (o.dates, from the card builder)
    PARTS.forEach(p => { if (!d.date.held[p]) d.date.held[p] = (o.dates || {})[partField(d.date, p)] || ((o.fields || []).find(x => x.key === partField(d.date, p)) || {}).value || ""; });
    d.existing = showDate(d.date.held) ? [showDate(d.date.held)] : [];
  });
  return out;
}
// The date on screen: TTE's parts, the news's over them, then whatever the reviewer typed.
const dateOf = (st, k, ch) => st.val[k] || (st.val[k] = { ...ch.date.held, ...ch.date.news });
const fromTTE = (ch, now, p) => !(p in ch.date.news) && now[p] === ch.date.held[p];

function diffHtml(diff, full) {
  return diff.map((d, i) => {
    if (d.op === "in") return `<span class="add">${esc(d.text)}</span>`;
    if (d.op === "out") return `<del>${esc(d.text)}</del>`;
    const t = d.text, first = i === 0, last = i === diff.length - 1;
    if (full || t.length <= 260) return `<span class="fade">${esc(t)}</span>`;
    if (first) return `<span class="gap">… </span><span class="fade">${esc(tail(t, 200))}</span>`;
    if (last) return `<span class="fade">${esc(head(t, 160))}</span><span class="gap"> …</span>`;
    return `<span class="fade">${esc(head(t, 100))}</span><span class="gap"> … </span><span class="fade">${esc(tail(t, 100))}</span>`;
  }).join(" ");   // the parts are runs of words: without the space, "2025." and "2025, and" read "2025.2025, and"
}
// a hand-edited description, shown against what TTE has: new sentences green, dropped ones struck
function sentDiff(was, now) {
  const split = t => String(t || "").split(/(?<=[.!?。！？])\s+/).filter(Boolean);
  const A = split(was), B = split(now), inA = new Set(A), inB = new Set(B);
  return B.map(x => inA.has(x) ? `<span class="fade">${esc(x)}</span>` : `<span class="add">${esc(x)}</span>`).join(" ")
    + A.filter(x => !inB.has(x)).map(x => ` <del>${esc(x)}</del>`).join("");
}
const srcIdxOf = (c, links) => [...new Set((links || []).map(l => c.sources.findIndex(s => s.link === l)).filter(i => i >= 0))].sort((a, b) => a - b);

function change(c, st) {
  const o = chosenOpt(c, st), rows = rowsFor(c, o), n = rows.length, k = st.ch, ch = rows[k];
  const { sup, si } = srcFor(c, st, k, ch);
  const editing = !!st.edit[k];
  const isText = !!ch.diff;
  const vals = isText ? [] : ch.date ? Object.entries(ch.date.news).map(([p, v]) => showPart(p, v)) : valsOf(st, k, ch);
  const after = isText ? (st.text[k] != null ? st.text[k] : ch.result) : "";
  const REL = Array.isArray(ch.inTTE), linked = new Set((ch.inTTE || []).filter(x => x.uid).map(x => x.name));
  const inTte = v => linked.has(v) || idxHas(v);
  const refsOf = v => srcIdxOf(c, (ch.perValue || []).filter(x => x.value === v).flatMap(x => x.sources || []).concat((ch.saidBy || []).filter(x => x.value === v).map(x => x.from)));
  const mode = isText ? "" : modeOf(st, k, ch), replace = mode === "replace";

  let title, body, tools = "";
  const was = (ch.existing || []).join(" ");
  if (isText) {
    title = ch.diff.some(d => d.op === "out") ? `Rewrite ${fq(ch.field)} like this?` : `Add this to ${fq(ch.field)}?`;
    const long = was.length > 260 || ch.diff.some(d => d.op === "same" && d.text.length > 260);
    body = `<div class="row"><div class="tag">${esc(fieldLabel(ch.field))} in TTE now</div><div class="desc fade">${st.descFull ? esc(was) : (was.length > 260 ? `<span class="gap">… </span>${esc(tail(was, 220))}` : esc(was) || "<em>no description</em>")}</div></div>
      <div class="arrow"><span>after you accept</span><i class="ln"></i><button class="editbtn ${editing ? "on" : ""}" data-act="edit">${editing ? "Done" : "&#9998; Edit"}</button></div>
      <div class="row">${editing ? `<textarea class="dta" aria-label="The text after you accept">${esc(after)}</textarea>`
                                  : `<div class="desc">${st.text[k] != null ? sentDiff(was, after) : diffHtml(ch.diff, st.descFull)}</div>`}
        ${!editing && long && st.text[k] == null ? `<button class="more" data-act="descfull">${st.descFull ? "Show less &#9652;" : "Show all of it &#9662;"}</button>` : ""}
        ${editing && st.text[k] != null ? `<button class="more" data-act="resettext">Put back the proposed wording</button>` : ""}
</div>`;
  } else if (ch.date) {
    const now = dateOf(st, k, ch);
    title = `Set ${fq(ch.field)} to this?`;
    const shown = PARTS.filter(p => now[p]).map(p => fromTTE(ch, now, p)
      ? `<span class="old" title="Kept from TTE: the news does not give it">${esc(showPart(p, now[p]))}</span>`
      : `<span class="newv">${esc(showPart(p, now[p]))}</span>`).join(" ");
    body = `<div class="row"><div class="tag">${esc(fieldLabel(ch.field))} in TTE now</div><div class="was">${ch.existing.length ? `<s>${esc(ch.existing[0])}</s>` : "<em>none recorded</em>"}</div></div>
      <div class="arrow"><span>after you accept</span><i class="ln"></i><button class="editbtn ${editing ? "on" : ""}" data-act="edit">${editing ? "Done" : "&#9998; Edit"}</button></div>
      ${editing ? `<div class="dparts">${PARTS.map(p => `<label>${p.toLowerCase()}<input class="din" data-p="${p}" value="${esc(now[p] || "")}" inputmode="numeric" placeholder="${PART_FMT[p]}" maxlength="${p === "Year" ? 4 : 2}"></label>`).join("")}</div>`
                : `<div class="final">${shown || "<em>no date</em>"}</div>`}`;
    if (ch.split) {
      // sources that disagree: each one's date, its parts over TTE's
      const by = new Map(); ch.saidBy.forEach(x => { if (!by.has(x.from)) by.set(x.from, {}); by.get(x.from)[x.part] = x.value; });
      const said = [...by.entries()].map(([from, parts]) => `<b>${esc(showDate({ ...ch.date.held, ...parts }))}</b> <span>${srcIdxOf(c, [from]).map(r => "\u00b7" + (r + 1)).join(" ")}</span>`);
      if (said.length > 1) body = `<div class="note">The sources disagree: ${said.join(", ")}. Edit the date to the one you trust.</div>` + body;
    }
  } else {
    // The non-English name has the same Edit and Add / Replace as any list: the reviewer may correct the name, or
    // replace one TTE holds that is wrong.
    const vn = vals.filter(v => v.trim()).join(" | ") || c.entity;
    title = ch.variant ? (replace ? `Make ${vn} this record's only non-English name?` : `Add ${vn} to this record as a non-English name?`)
          : replace ? `Set ${fq(ch.field)} to this?` : ch.strategy === "INSERT_RELATION" ? `Link ${fq(ch.field)} to this record?` : `Add this to ${fq(ch.field)}?`;
    const rowsHtml = vals.map((v, i) => {

    : EV.report ? `<p class="minor">Scored ${esc(dayOf(EV.report.at))}, from the labels pulled to the PC that holds the AI&rsquo;s answers.</p><section class="focus"><pre class="evreport">${esc(EV.report.report)}</pre></section>`
    : `<p class="minor">Not scored yet. Once the sheets are labelled, run <code>python -m src.eval online pull</code>, then <code>python -m src.eval online results</code>.</p>`;
  return `<div class="phead"><h1>Evaluation</h1><button class="quiet" data-act="ev-how">How this works</button></div>
  <p class="minor">Only evaluators see this page. For relevance and matching, the AI&rsquo;s answers are kept off it, so you cannot see what you are grading.</p>
  ${testing ? `<p class="notice test">Test account: try anything you like. Nothing you label is saved.</p>` : ""}${EV.error ? `<p class="notice">${esc(EV.error)}</p>` : ""}
  <h2 class="h2">Label the sheets</h2>
  <section class="focus">${EV.progress === null && !EV.error ? `<p class="empty">Loading&hellip;</p>` : tasks}</section>
  <p class="minor">Everyone labels the same first rows of each sheet (${EV_SHARED.relevance} headlines, ${EV_SHARED.matching} pairs, ${EV_SHARED.extraction} articles), so the labellers&rsquo; agreement can be measured. The rest are shared out: each is given to one person only.</p>
  <h2 class="h2">Results</h2>${rep}
  <h2 class="h2">Changes accepted on the desk</h2>
  <p class="minor">Of the changes reviewers were shown, the share they accepted. A change left out is not always a wrong one: a reviewer may leave out a true detail that does not belong.</p>
  <section class="focus an">${evAcceptance()}</section>`;
}
function evScreen() {
  const T = EV_TASKS[EV.task], r = EV.item, L = EV.label;
  if (EV.guide) return `<div class="evhead"><span><b>${T.name}</b> &middot; the rules</span><span class="qrow"><button class="quiet" data-act="ev-stop">Back to the sheets</button></span></div>
    <section class="focus evread">${evGuideHtml(EV.task)}</section>
    <div class="actions"><button class="stamp go" data-act="ev-guide-done"><b>Accept and start</b></button></div>`;
  const head = `<div class="evhead"><span><b>${T.name}</b>${r ? ` &middot; ${r.ord <= EV_SHARED[EV.task] ? `one of everyone&rsquo;s ${EV_SHARED[EV.task]}` : "given to you alone"}` : ""}${EV.back.length ? ` &middot; ${EV.back.length} done` : ""}</span>
    <span class="qrow">${EV_GUIDE[EV.task] ? `<button class="quiet" data-act="ev-guide">Rules</button>` : ""}${EV.back.length ? `<button class="quiet" data-act="ev-back">Back</button>` : ""}<button class="quiet" data-act="ev-stop">Stop for now</button></span></div>`
    + (testing ? `<p class="notice test">Test account: nothing you label is saved.</p>` : "") + (NOTICE ? `<p class="notice">${esc(NOTICE)}</p>` : "")
    + (EV.error ? `<p class="notice">${esc(EV.error)} <button class="quiet" data-act="${r ? "ev-save" : "ev-retry"}">Try again</button></p>` : "");
  if (!r) return head + (EV.busy || EV.error ? (EV.busy ? `<div class="done-card"><h2>Finding your next row&hellip;</h2></div>` : "")
    : `<div class="done-card"><div class="bigtick">&#10003;</div><h2>Nothing left for you on this sheet</h2><p>Every row in your languages is labelled, or on a colleague&rsquo;s screen.</p><button class="evgo" data-act="ev-stop">Back to the sheets</button></div>`);
  // a row come back to with Back shows the answer given
  const b = r.body, was = (k, v) => L && L[k] === v ? " was" : "";
  // relevance is judged from the headline and summary alone, as the AI judges it: no link to the article
  const src = (url, link) => `<span class="src">${esc(outletOf(url))}${b.published ? ` &middot; ${esc(dayOf(b.published))}` : ""}${link ? ` &middot; <a href="${esc(url)}" target="_blank" rel="noopener">Open article &#8599;</a>` : ""}</span>`;
  const ask = `<p class="evq">${T.ask}</p>`;
  if (EV.task === "relevance") return head + `<section class="focus"><div class="side news"><div class="label"><span>In the news</span>${src(b.url, false)}</div>
      <blockquote>${esc(b.title)}</blockquote>${b.description ? `<p class="evdesc">${esc(b.description)}</p>` : ""}</div></section>${ask}
    <div class="actions"><div class="pair"><button class="stamp go${was("relevant", true)}" data-act="ev-rel" data-v="y"><b>Yes, relevant</b><span>Key Y</span></button>
      <button class="stamp red${was("relevant", false)}" data-act="ev-rel" data-v="n"><b>No</b><span>Key N</span></button></div></div>`;
  if (EV.task === "matching") return head + `<section class="focus"><div class="side news"><div class="label"><span>In the news</span>${src(b.url, true)}</div>
      <blockquote>${evMark(b.evidence, [b.name, b.name_en])}</blockquote>
      <p class="tr">${esc(b.name)}${b.name_en && b.name_en !== b.name ? ` (${esc(b.name_en)})` : ""}${b.article ? ` &middot; from &ldquo;${esc(gist(b.article, 90))}&rdquo;` : ""}</p></div>
    <div class="join">same?</div>
    <div class="side tte"><div class="label"><span>In TTE now</span><span class="src">no. ${esc(b.tte_id)}</span></div><p class="name">${esc(b.tte_name)}</p>
      ${(b.tte_fields || []).length ? `<div class="evrec">${b.tte_fields.map(([k, v]) => `<div><span class="k">${esc(k)}</span><span>${esc(v)}</span></div>`).join("")}</div>` : `<p class="ident">Nothing else on the record.</p>`}</div></section>${ask}
    <div class="actions"><div class="evtrio"><button class="stamp go${was("same", "Y")}" data-act="ev-same" data-v="Y"><b>Same</b><span>Key Y</span></button>
      <button class="stamp red${was("same", "N")}" data-act="ev-same" data-v="N"><b>Different</b><span>Key N</span></button>
      <button class="stamp grey${was("same", "?")}" data-act="ev-same" data-v="?"><b>Can&rsquo;t tell</b><span>Key ?</span></button></div></div>`;
  const names = (b.names || []).map((n, i) => {
    const g = L.names[n.entity];
    return `<div class="evname"><div><b>${esc(n.entity)}</b><span class="tt">${esc(kind({ type: n.type || "" }))}</span></div>
      ${n.evidence ? `<p class="tr">&ldquo;${esc(gist(n.evidence, 240))}&rdquo;</p>` : ""}
      <div class="ev3">${EV_VERDICTS.map(([v, t]) => `<button class="${v}${g.verdict === v ? " on" : ""}" data-act="ev-verdict" data-i="${i}" data-v="${v}">${t}</button>`).join("")}</div>
      ${g.verdict === "ok" && n.fields.length ? `<p class="hint">Tap any detail that is wrong.</p><div class="evchips">${n.fields.map(([k, v], j) => `<button class="evchip${g.wrong_fields.includes(k || gist(v, 40)) ? " bad" : ""}" data-act="ev-field" data-i="${i}" data-j="${j}" title="${esc(v)}">${k ? `<b>${esc(k)}</b>` : ""}${esc(gist(v, 120))}</button>`).join("")}</div>` : ""}</div>`;
  }).join("");
  const missed = `<div class="evname"><div><b>Did it miss anyone?</b></div><p class="hint">Anyone in the article who has, or should have, a TTE record and is not highlighted.</p>
    ${b.text && L.missed.length ? `<div class="evchips">${L.missed.map((m, k) => `<button class="evchip miss" data-act="ev-unmiss" data-i="${k}" title="Take it off">${esc(m)} &#10005;</button>`).join("")}</div>` : ""}
    ${b.text ? `<div class="ev3"><button id="evadd" data-act="ev-addmiss" ${EV.sel ? "" : "disabled"}>${EV.sel ? `Add &ldquo;${esc(gist(EV.sel, 40))}&rdquo; as missed` : "Select a name in the article to add it"}</button></div>`
      : `<textarea id="evmisstxt" rows="3" placeholder="The article's text could not be fetched: open it, and write each name it missed on its own line">${esc(L.missed.join("\n"))}</textarea>`}
    <div class="ev3"><button class="ok${L.none && !L.missed.length ? " on" : ""}" data-act="ev-none" ${L.missed.length ? "disabled" : ""}>Nothing missed</button></div></div>`;
  return head + `<div class="evext"><div class="evtext" id="evtext"><h2>${esc(b.title)}</h2>${b.text ? evMark(b.text, (b.names || []).map(n => n.entity)) : `<a href="${esc(b.url)}" target="_blank" rel="noopener">Open the article &#8599;</a>`}</div>
    <div class="evnames"><p class="evq" style="margin:0">${T.ask}</p>${names}${missed}
      <div class="actions"><button class="stamp go" data-act="ev-save" ${evReady() ? "" : "disabled"}><b>Save and next</b><span>${evTodo()}</span></button></div></div></div>`;
}
const evalPage = () => !isEvaluator() ? `<div class="done-card"><h2>Evaluation</h2><p>This page is for evaluators.</p></div>` : EV.task ? evScreen() : evOverview();
// The words selected in the article, kept when the click on "Add" empties the selection; a click in the text without
// selecting anything clears them.
document.addEventListener("selectionchange", () => {
  if (PAGE !== "evaluation" || EV.task !== "extraction" || !EV.item) return;
  const s = window.getSelection(), box = $("#evtext"), btn = $("#evadd");
  if (!s || !box || !btn || !s.rangeCount || !box.contains(s.anchorNode)) return;
  EV.sel = box.contains(s.focusNode) ? s.toString().replace(/\s+/g, " ").trim().slice(0, 120) : EV.sel;
  btn.disabled = !EV.sel;
  btn.innerHTML = EV.sel ? `Add &ldquo;${esc(gist(EV.sel, 40))}&rdquo; as missed` : "Select a name in the article to add it";
});

function navState() {
  document.querySelectorAll(".navi").forEach(b => b.classList.toggle("on", b.dataset.nav === PAGE));
  $("#topbar").hidden = $("#progwrap").hidden = PAGE !== "review";
  $("#waitbadge").textContent = CARDS.filter(available).length;
  $("#signout").hidden = !me; if (me) $("#signout").title = "Sign out " + myName;
  // Which account this is, on every page: a reviewer once decided eleven records on their real account,
  // sure they were in the test one (23 Oct 2026).
  const who = $("#who"); who.hidden = !me;
  if (me) {
    who.className = testing ? "who test" : "who";
    who.innerHTML = testing ? `<span><b>Test account</b> &middot; ${esc(me.email || "")} &middot; nothing is saved</span>`
                            : `Signed in as <b>${esc(me.email || myName)}</b> &middot; your decisions are saved &middot; <button data-act="changepw">Change password</button>`;
  }
  $("#langpill").textContent = "Reading: " + (langs ? langs.map(l => LANG_NAMES[l]).join(" + ") : "all languages");
  $("#evalnav").hidden = !isEvaluator();
}
function draw(top) {
  const c = card(); navState();
  const lines = (testing ? `<p class="notice test">Test account: try anything you like. Nothing is saved and no record is held.</p>` : "")
              + (NOTICE ? `<p class="notice">${esc(NOTICE)}</p>` : "");
  const wait = (h, p, b) => `<div class="done-card"><h2>${h}</h2>${p ? `<p>${p}</p>` : ""}${b || ""}</div>`;
  if (loading) $("#stage").innerHTML = wait(esc(loading));
  else if (QUEUE() && PAGE === "review" && DEAL && DEAL !== "none") $("#stage").innerHTML =
    DEAL === "asking" ? wait("Finding your next record&hellip;")
    : DEAL === "saving" ? wait("Saving&hellip;")
    : DEAL === "unsaved" ? wait("Not saved yet", "The connection dropped. Your decision is kept on this computer and goes up as soon as the connection is back.", `<button class="stamp go" data-act="resend"><b>Try again now</b></button>`)
    : wait("The database did not answer", "Your decisions so far are saved. Check the connection, then try again.", `<button class="stamp go" data-act="redeal"><b>Try again</b></button>`);
  else if (PAGE === "home" || (PAGE === "review" && (!c || allDone))) { PAGE = "home"; navState(); $("#stage").innerHTML = homePage(); }
  else if (PAGE === "results") $("#stage").innerHTML = resultsPage();
  else if (PAGE === "analytics") $("#stage").innerHTML = analyticsPage();
  else if (PAGE === "downloads") $("#stage").innerHTML = downloadsPage();
  else if (PAGE === "evaluation") {   // the article keeps its place while names are marked beside it
    const t = $("#evtext"), y = t ? t.scrollTop : 0;
    $("#stage").innerHTML = evalPage();
    const t2 = $("#evtext"); if (t2 && !top) t2.scrollTop = y;
  }
  else if (!c || allDone) $("#stage").innerHTML = `<div class="done-card"><div class="bigtick">&#10003;</div><h2>${LOG.length ? "All done" : "Nothing waiting for you"}</h2><p>${LOG.length ? "That was every card you can read." : "No cards match your languages and the type you chose."}</p>${LOG.length && !ONLINE ? `<button class="stamp go" data-act="restart"><b>Start over</b><span>clears this session</span></button>` : ""}</div>`;
  else {
    const held = claimed(c);
    if (held === true) $("#stage").innerHTML = lines + cardNote(c) + SCREEN[stOf(c).screen](c, stOf(c));
    else if (held === "retry") $("#stage").innerHTML = wait("The database did not answer", "Your decisions so far are saved. Check the connection, then try again.", `<button class="stamp go" data-act="retryclaim"><b>Try again</b></button>`);
    else $("#stage").innerHTML = wait("Checking nobody else has this record&hellip;");
  }
  const avail = CARDS.filter(c => available(c) && !(QUEUE() && DECIDED.has(c.key) && !openFor(c))).length, pending = Object.keys(UNSENT).length;
  $("#count").textContent = `${LOG.length} of ${LOG.length + avail} records reviewed`
    + (ONLINE && !testing && me ? (pending ? ` \u00b7 ${pending} not saved yet` : LOG.length ? " \u00b7 all saved" : "") : "");
  $("#pos").textContent = LIST.length ? `${cur + 1} / ${LIST.length}` : "0 / 0";
  $("#prog").style.width = (LOG.length / Math.max(1, LOG.length + avail) * 100) + "%";
  $("#jump").value = String(cur);
  if (top) window.scrollTo(0, 0);
  const q = $("#q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}
function fillJump() {
  $("#jump").innerHTML = LIST.map((ci, n) => { const c = CARDS[ci], rc = rowsFor(c, ordered(c)[0]).length; return `<option value="${n}">${ci + 1}. ${esc(gist(c.entityEn ? c.entity + " / " + c.entityEn : c.entity, 40))} \u00b7 ${esc(kind(c))}${c.isNew ? " \u00b7 new" : ""}${rc ? " \u00b7 " + rc + " change" + (rc > 1 ? "s" : "") : ""}</option>`; }).join("");
}
function fillGroups() {
  const base = CARDS.filter(available);
  // a type with nothing in your languages cannot be picked: picking it would only send you home
  $("#group").innerHTML = `<option value="all">All records (${base.length})</option>` + GROUPS.map(([k, n]) => { const v = base.filter(c => groupOf(c) === k).length;
    return `<option value="${k}" ${v || k === group ? "" : "disabled"}>${n} (${v})</option>`; }).join("");
  $("#group").value = group;
}
function buildList(filter) {
  const keep = { all: () => true, who: c => !c.isNew, new: c => c.isNew, chg: c => ordered(c).some(o => rowsFor(c, o).length), flag: c => c.isFlag }[filter || "all"];
  LIST = CARDS.map((c, i) => [c, i]).filter(([c]) => keep(c) && available(c) && (group === "all" || groupOf(c) === group)).map(([, i]) => i);
  LIST.sort((a, b) => MINE.has(CARDS[b].key) - MINE.has(CARDS[a].key));   // a record already on your desk comes first
  cur = 0; allDone = !LIST.length && LOG.length > 0; fillJump(); fillGroups();
}
$("#jump").addEventListener("change", e => { cur = Number(e.target.value); draw(true); });
$("#filter").addEventListener("change", e => { buildList(e.target.value); draw(true); });
$("#group").addEventListener("change", e => {
  group = e.target.value; PAGE = "review"; buildList($("#filter").value);
  // online, a record of another type is given back as the next is taken, in one step: however fast the type is
  // switched, this reviewer holds one record at most
  if (QUEUE() && !fits(card()) && DEAL !== "saving" && DEAL !== "unsaved") return deal();
  draw(true);
});

// every card, every screen, editing or not: a page that throws on one card should be found here, not by a reader
function selftest() {
  let screens = 0; const errors = [];
  const T = { n: 0, name: { same: 0, part: 0, diff: 0 }, extraOk: 0, cross: 0, nothing: 0, chips: 0, newChips: 0 };
  CARDS.forEach((c, n) => {
    const st = fresh(c); S[c.key] = st;
    const run = (name, fn) => { try { const h = fn(); if (typeof h !== "string" || h.length < 50) throw new Error("empty screen"); screens++; } catch (e) { errors.push(`#${n + 1} ${c.entity} ${name}: ${e.message}`); } };
    if (c.isNew) run("create", () => create(c, st));
    ordered(c).forEach((o, i) => {
      run("who " + i, () => who(c, Object.assign(st, { cand: i })));
      const rows = checks(c, o); T.n++;
      const nm = rows[0].k === "ok" ? "same" : rows[0].k === "part" ? "part" : "diff"; T.name[nm]++;
      const rest = rows.slice(1);
      if (rest.some(r => r.k === "ok")) T.extraOk++; if (rest.some(r => r.k === "bad")) T.cross++; if (!rest.some(r => r.k === "ok" || r.k === "bad")) T.nothing++;
      rowsFor(c, o).forEach((ch, j) => {
        Object.assign(st, { chosen: i, cand: i, ch: j });
        [false, true].forEach(ed => { st.edit[j] = ed; run(`change ${i}.${j}${ed ? " edit" : ""}`, () => change(c, st)); });
        st.edit[j] = false;
        const html = change(c, st); T.chips += (html.match(/class="vrow /g) || []).length; T.newChips += (html.match(/class="vrow new/g) || []).length;
        (ch.supporters || []).forEach((_, q) => { st.csrc[j] = srcIdxOf(c, ch.supporters)[q]; run(`change ${i}.${j} source ${q}`, () => change(c, st)); });
      });
    });
    run("create (set aside)", () => create(c, Object.assign(st, { exhausted: true, full: true, finding: true, query: "alliance" })));
    S[c.key] = undefined;
  });
  try { buildList(); homePage(); sheetPage(); teamPage(); resultsPage(); VIEW = "team"; resultsPage(); VIEW = "mine"; analyticsPage(); downloadsPage(); LOG.push({ key: "x", name: "X", type: "PERSON", group: "people", kind: "approved", rec: "R", uid: "1", when: new Date(), secs: 5, accepted: [{ field: "Awards", value: "A", link: "" }], link: "", found: false, done: false }); homePage(); sheetPage(); teamPage(); analyticsPage(); downloadsPage(); LOG.length = 0; screens += 8; }
  catch (e) { errors.push("pages: " + e.message); }
  const msg = `selftest: ${CARDS.length} cards, ${screens} screens, ${errors.length} errors` + (errors.length ? "\n" + errors.slice(0, 20).join("\n") : "")
    + `\nchecks over ${T.n} candidate records: name same ${T.name.same}, part ${T.name.part}, different ${T.name.diff}; a shared fact beyond the name ${T.extraOk}; a conflicting fact ${T.cross}; nothing but the name to go on ${T.nothing}`
    + `\nvalue rows on change screens: ${T.chips}, of which not in TTE (orange): ${T.newChips}`;
  const pre = $("#selftest"); pre.hidden = false; pre.textContent = msg; document.title = msg.split("\n")[0];
}

(function init() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (REVIEW && !p.has("proto")) document.body.classList.add("noproto");
  if (ONLINE) { loading = "Signing in\u2026"; draw(); startOnline(); return; }
  buildList("all");
  if (p.has("c")) { PAGE = "review"; cur = Math.min(CARDS.length - 1, Number(p.get("c"))); const c = card(), st = stOf(c);
    if (p.get("s")) Object.assign(st, { screen: p.get("s"), ch: Number(p.get("i") || 0), cand: Number(p.get("cand") || 0), chosen: p.get("s") === "change" ? Number(p.get("cand") || 0) : null, kind: p.get("k") || "", exhausted: p.get("x") === "1", full: p.get("full") === "1", finding: p.get("find") === "1", query: p.get("q") || "" });
    if (p.get("edit") === "1") st.edit[st.ch] = true; if (p.has("src")) st.csrc[st.ch] = Number(p.get("src")); }
  if (location.search.includes("phone")) { $("#wrap").classList.add("phone"); $("#phone").classList.add("on"); }
  if (p.has("demo")) { ["approved", "created", "approved", "uptodate", "discard", "keep"].forEach((kd, n) => { const c = CARDS[n * 3 + 1]; LOG.push({ key: c.key, name: c.entityEn ? `${c.entity} (${c.entityEn})` : c.entity, type: c.type, group: groupOf(c), kind: kd, rec: kd === "approved" || kd === "uptodate" ? (c.options[0] || {}).name || "" : kd === "created" ? "new record" : "", uid: "", when: new Date(), secs: 40 + n * 25, accepted: kd === "approved" ? [{ field: "Awards", value: "x", link: "" }, { field: "Description", value: "y", link: "" }] : [], seen: kd === "approved" ? 3 : 0, link: "", found: n === 2, done: n === 0 }); DECIDED.add(c.key); }); buildList(); }
  if (p.get("flow") === "back2") {
    PAGE = "review"; cur = LIST.indexOf(14); draw(); const c = CARDS[14], st = stOf(c), r = [];
    r.push(["start", st.screen, st.hist.length]);
    act("cand", { dataset: { i: "0" } }); r.push(["after choosing a closest record", st.screen, st.hist.length]);
    act("back"); r.push(["after back", st.screen, st.hist.length]);
    act("find"); st.query = "snow"; act("pickhit", { dataset: { u: INDEX.find(x => x[1] === "Snow City")[0], npt: "" } }); r.push(["after picking a search result", st.screen, st.extra.length]);
    act("back"); r.push(["after back", st.screen, st.extra.length]);
    const pre = $("#selftest"); pre.hidden = false; pre.textContent = "FLOW\n" + JSON.stringify(r); return;
  }
  if (p.get("flow") === "shanti") {
    PAGE = "review"; cur = LIST.indexOf(16); draw(); act("same");
    for (let g = 0; g < 20 && LOG.length === 0; g++) act("accept");
    const pre = $("#selftest"); pre.hidden = false; pre.textContent = "FLOW\n" + JSON.stringify(changesRows(LOG), null, 1); return;
  }
  if (p.get("rail") === "open") $("#panel").classList.add("open");
  if (p.get("page")) PAGE = p.get("page"); if (p.get("view")) VIEW = p.get("view"); if (p.has("nosample")) { SAMPLE = false; _team = null; $("#samplebtn").classList.remove("on"); buildList(); }
  draw();
  if (!p.has("c") && !p.has("selftest") && !p.has("nowelcome")) welcome(); else if (!p.has("c") && !p.has("selftest") && !langs && !p.has("demo")) settings();
  if (p.has("selftest")) selftest();
})();
</script>
