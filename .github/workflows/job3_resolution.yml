name: Job 3 - Entity Resolution

# Run by hand; the nightly schedule is in nightly.yml.
on:
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Secrets live in this GitHub Environment, not at repo level.
    environment: automated-tte-enrichment

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Exactly what uv.lock pins, and a failure if pyproject.toml has
      # drifted from it. One source of truth for local and CI alike.
      - run: uv sync --frozen --no-dev

      - name: Resolve entities
        run: uv run python -m src.job3_resolution
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
