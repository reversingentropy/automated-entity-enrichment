<title>TTE Review Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* The desk changes with the light; the paper on it does not. Newsprint is
     newsprint and an index card is cream in any theme, so only the desk tones
     and the text that sits directly on the desk are redefined for dark. */
  /* Text on the desk is at least 4.5:1 against it in every theme. The first
     brown (#8B7A66) put the masthead links at 1.8:1 and the question at 3.7. */
  :root {
    --desk:#615243; --desk-deep:#463B30; --desk-edge:#2E2620;
    --ui:#FAF6EE; --ui-faint:#E9E1D4; --ui-dim:#DDD3C3;
    --news:#EDE7DA; --news-ink:#1F1B16; --news-soft:#5A5248; --news-rule:#B8AE9C;
    --card:#F7F0DA; --card-ink:#1B2338; --card-soft:#4A5062; --card-rule:#D5CBAE;
    --card-red:#B7463B;
    --pencil:#4E4843; --pencil-lead:#2A2624;
    --tick:#2E7A4A; --struck:#9A3B32;
    --stamp-red:#B3322B; --stamp-red-bg:#F3DCD9;
    /* Yes is green, the colour the desk already uses for "agrees": red
       reads as stop or delete on a screen, whatever it means on a stamp. */
    --stamp-go:#1F6B3F; --stamp-go-bg:#DCEBDD;
    --stamp-grey:#4F5864; --stamp-grey-bg:#E2E6EA;
    --stamp-amber:#9E6410; --stamp-amber-bg:#F3E6CE;
    --sheet:#F7F2E8; --sheet-ink:#1F1B16;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --desk:#2B2521; --desk-deep:#1E1A17; --desk-edge:#120F0D;
      --ui:#EDE6DA; --ui-faint:#C9BFB0; --ui-dim:#ADA292;
    }
  }
  :root[data-theme="dark"] {
    --desk:#2B2521; --desk-deep:#1E1A17; --desk-edge:#120F0D;
    --ui:#EDE6DA; --ui-faint:#C9BFB0; --ui-dim:#ADA292;
  }
  /* The light desk, asked for by the second reviewer: a pale surface with
     dark type. The paper and the clippings keep their own colours. */
  :root[data-theme="light"] {
    --desk:#EFE9DD; --desk-deep:#D8D0BF; --desk-edge:#BFB5A2;
    --ui:#2A241E; --ui-faint:#4A4238; --ui-dim:#574E41;
    --tab:#FBF7EE; --tab-ink:#3A3328; --amber-hint:#7A4E06;
  }
  :root { --tab:#D9CFB8; --tab-ink:#3A3328; --amber-hint:#F4D8A4; }

  *,*::before,*::after{box-sizing:border-box}
  body{background:var(--desk);color:var(--ui);
       font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:15px;
       line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible,textarea:focus-visible{
    outline:2px solid var(--ui);outline-offset:2px}
  .wrap{max-width:60rem;margin:0 auto;padding:.9rem 1.25rem 2rem;
        display:flex;flex-direction:column;gap:.9rem}

  /* masthead: the count on the left; the two pages a reviewer goes to as
     buttons, help as a link, and everything set once (theme, sound,
     settings, sign out) in a menu under the reviewer's name. Seven equal
     underlined links were one too many things to read past. */
  .top{display:flex;align-items:center;gap:.4rem 1rem;flex-wrap:wrap}
  .top h1{margin:0;font-family:Newsreader,Georgia,serif;font-weight:600;
          font-size:1.25rem;letter-spacing:.01em}
  .count{font-family:"Courier Prime","Courier New",monospace;font-size:.85rem;color:var(--ui-faint)}
  .outcomes{font-family:"Courier Prime","Courier New",monospace;font-size:.8rem;color:var(--ui-faint)}
  .top .spacer{flex:1}
  .top .topbtn{font:inherit;font-size:.85rem;color:var(--ui);background:rgba(0,0,0,.14);
               border:1.5px solid var(--ui-dim);border-radius:5px;padding:.3rem .75rem}
  .top .topbtn:hover{background:rgba(0,0,0,.26)}
  .top .topbtn.plain{background:none;border-color:transparent;text-decoration:underline;
                     text-underline-offset:.2em;padding:.3rem .2rem}
  .menu{position:relative}
  .menu summary{list-style:none;cursor:pointer;font-size:.85rem;color:var(--ui);padding:.3rem .6rem;
                border-radius:5px;border:1.5px solid transparent}
  .menu summary::-webkit-details-marker{display:none}
  .menu summary::after{content:" \25BE";color:var(--ui-faint)}
  .menu[open] summary,.menu summary:hover{border-color:var(--ui-dim)}
  .menu-panel{position:absolute;right:0;top:calc(100% + .3rem);z-index:20;min-width:11rem;
              background:var(--sheet);color:var(--sheet-ink);border-radius:5px;
              box-shadow:0 8px 24px rgba(0,0,0,.35);padding:.35rem;display:flex;flex-direction:column}
  .menu-panel button{background:none;border:none;text-align:left;font:inherit;font-size:.88rem;
                     color:var(--sheet-ink);padding:.45rem .6rem;border-radius:3px}
  .menu-panel button:hover{background:rgba(0,0,0,.07)}
  .me{display:contents}
  .signed-out .top .topbtn,.signed-out .menu,.signed-out .count,.signed-out .outcomes{display:none}
  .rail{height:3px;background:var(--desk-deep);border-radius:2px;overflow:hidden}
  #bar{height:100%;background:var(--ui-faint);width:0;transition:width .3s}
  @media (prefers-reduced-motion:reduce){#bar{transition:none}}

  #stage{display:flex;flex-direction:column;gap:.9rem}
  .ask{margin:.4rem 0 0;font-family:Newsreader,Georgia,serif;font-weight:400;
       font-size:clamp(1.35rem,3.6vw,1.8rem);line-height:1.2;text-wrap:balance;color:var(--ui)}
  .hint{margin:-.3rem 0 0;font-size:.9rem;color:var(--ui-faint);line-height:1.5}
  .hint.amber{color:var(--amber-hint)}
  .agree{margin:0;font-size:.88rem;color:var(--ui);line-height:1.5;
         padding:.5rem .8rem;border-left:3px solid var(--tick);background:rgba(0,0,0,.12);border-radius:0 4px 4px 0}
  .warnbox{font-size:.9rem;color:var(--ui);padding:.55rem .8rem;border-radius:4px;
           background:var(--stamp-red);line-height:1.45}

  /* the two documents on the desk */
  .desk{display:grid;gap:1.1rem;position:relative;align-items:start}
  @media (min-width:44rem){.desk{grid-template-columns:1fr 1fr}}
  .clip,.acard{border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.22);
               padding:1rem 1.1rem 1.1rem;min-width:0;overflow-wrap:anywhere}
  @media (min-width:44rem){
    .clip{transform:rotate(-.6deg)}
    .acard{transform:rotate(.45deg)}
  }

  .clip{background:var(--news);color:var(--news-ink);font-family:Newsreader,Georgia,serif;
        display:flex;flex-direction:column;gap:.55rem}
  /* what each side of the desk is, said on it: "left" and "right" meant nothing to a first-time reviewer */
  .panel-label{font-family:"IBM Plex Sans",sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.12em;
               text-transform:uppercase}
  .clip .panel-label{color:var(--news-ink)}
  .acard .panel-label{color:var(--card-ink);margin-bottom:.1rem}
  .clip-mast{font-family:"IBM Plex Sans",sans-serif;font-size:.62rem;letter-spacing:.12em;
             text-transform:uppercase;color:var(--news-soft);padding-bottom:.35rem;
             border-bottom:1px solid var(--news-rule)}
  .clip-link{color:var(--news-ink);text-decoration:underline;text-decoration-color:var(--news-rule);
             text-underline-offset:.15em}
  .clip-link:hover{text-decoration-color:var(--news-ink)}
  .clip-ext{color:var(--news-soft)}
  .clip-sources{font-family:"IBM Plex Sans",sans-serif;font-size:.74rem;color:var(--news-soft);line-height:1.5}
  .src-tab{background:none;border:none;padding:0 .1rem;font:inherit;color:var(--news-soft);cursor:pointer}
  .src-open{text-decoration:none;color:var(--news-soft);padding:0 .15rem}
  .src-open:hover{color:var(--news-ink)}
  .src-tab sup{font-size:.62rem;color:var(--news-soft)}
  .src-tab.here{color:var(--news-ink);font-weight:600}
  .src-tab:hover{color:var(--news-ink)}
  .src-refs{font-size:.66rem;margin-left:.15rem;white-space:nowrap}
  .src-ref{background:none;border:none;padding:0 .12rem;font:inherit;font-size:inherit;color:var(--news-soft);cursor:pointer}
  .src-ref.here{color:var(--news-ink);font-weight:700}
  .src-ref:hover{color:var(--news-ink)}
  .corrob .src-refs{align-self:center;margin-right:.5rem}
  .corrob .src-ref{color:var(--ui)}
  .clip-head{margin:0;font-size:1.35rem;font-weight:600;line-height:1.15}
  .clip-body{margin:0;font-size:.98rem;line-height:1.5;color:var(--news-ink)}
  .clip-body.translated{font-size:.9rem;color:var(--news-soft);font-style:italic;margin-top:-.25rem}
  .clip-body.translated::before{content:"translated: ";font-style:normal;font-family:"IBM Plex Sans",sans-serif;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase}
  .clip .lines{border-top:1px solid var(--news-rule);padding-top:.5rem;margin-top:.15rem}
  .clip .lines dt{color:var(--news-soft)}

  .acard{background:var(--card);color:var(--card-ink);
         font-family:"Courier Prime","Courier New",monospace;
         background-image:repeating-linear-gradient(to bottom,transparent 0 1.55rem,var(--card-rule) 1.55rem calc(1.55rem + 1px));
         background-position:0 3.2rem;display:flex;flex-direction:column;gap:.45rem;position:relative}
  .acard::before{content:"";position:absolute;left:0;right:0;top:2.55rem;height:2px;background:var(--card-red);opacity:.75}
  .acard.blank{background-image:none}
  .acard.blank::before{display:none}
  .acard-top{display:flex;justify-content:space-between;font-size:.7rem;letter-spacing:.1em;
             text-transform:uppercase;color:var(--card-soft);min-height:1rem}
  .acard-name{margin:.35rem 0 0;font-size:1.25rem;font-weight:700;line-height:1.55rem;letter-spacing:.01em}
  .acard-desc{margin:.3rem 0 0;font-size:.86rem;line-height:1.55rem}
  .acard-desc.faint,.acard .blank{color:var(--card-soft)}
  .acard-foot{font-size:.7rem;color:var(--card-soft);margin-top:.2rem}

  /* the aligned facts */
  .lines{display:grid;grid-template-columns:auto 1fr;gap:0 .8rem;margin:0;font-size:.86rem;line-height:1.55rem}
  .lines dt{font-family:"IBM Plex Sans",sans-serif;font-size:.68rem;letter-spacing:.08em;
            text-transform:uppercase;color:var(--card-soft);align-self:baseline;white-space:nowrap}
  .lines dd{margin:0}
  .tick{color:var(--tick);font-weight:700}
  .blank{opacity:.55}

  /* pencil */
  .pencil .typed{color:var(--card-ink)}
  .pencil .lead{color:var(--pencil-lead);font-style:italic;
                background:linear-gradient(transparent 62%,rgba(78,72,67,.22) 62% 88%,transparent 88%)}
  .pencil .struck{color:var(--struck);text-decoration:line-through;opacity:.8}

  /* the drawer */
  .drawer{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.35rem;padding:.6rem .7rem .55rem;
          background:var(--desk-deep);border-radius:4px;border-bottom:4px solid var(--desk-edge)}
  .drawer-label{font-family:"Courier Prime",monospace;font-size:.68rem;letter-spacing:.1em;
                text-transform:uppercase;color:var(--ui-dim);margin-right:.4rem;align-self:center}
  .tab{font-family:"Courier Prime","Courier New",monospace;font-size:.78rem;padding:.3rem .65rem;
       border:none;border-radius:3px 3px 0 0;background:var(--tab);color:var(--tab-ink);
       max-width:16rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab.up{background:var(--card);color:var(--card-ink);font-weight:700;transform:translateY(-3px);
          box-shadow:0 -2px 6px rgba(0,0,0,.25)}
  .tab.out{text-decoration:line-through;opacity:.45;cursor:default}
  .tab.find{background:transparent;color:var(--ui-faint);text-decoration:underline}
  .tab .npt{font-weight:400;opacity:.75}
  .hit .npt{font-family:"Courier Prime",monospace;font-size:.72rem;letter-spacing:.06em;color:var(--news-soft)}
  .acard-npt{font-family:"Courier Prime",monospace;font-size:.74rem;letter-spacing:.06em;color:var(--card-soft);margin-top:.1rem}

  .find{display:flex;flex-direction:column;gap:.4rem}
  .find input{font-family:inherit;font-size:.95rem;padding:.55rem .7rem;border-radius:4px;
              border:1.5px solid var(--ui-dim);background:var(--sheet);color:var(--sheet-ink);width:100%}
  .hits{display:flex;flex-direction:column;gap:.25rem;max-height:14rem;overflow-y:auto}
  .hit{display:flex;gap:.6rem;align-items:baseline;text-align:left;padding:.4rem .6rem;
       border:none;border-radius:3px;background:var(--sheet);color:var(--sheet-ink);font-size:.86rem}
  .hit span{color:var(--news-soft);font-size:.78rem}
  .nohits{font-size:.84rem;color:var(--ui-faint)}

  /* the stamps, in a bar held at the foot of the window: on a 1280x720
     laptop they were below the fold on every screen, and each of the five
     or so decisions per record needed a scroll first */
  .actions{position:sticky;bottom:0;z-index:5;display:flex;gap:.7rem;align-items:stretch;
           margin:.2rem -1.25rem 0;padding:.65rem 1.25rem .75rem;background:var(--desk);
           box-shadow:0 -1px 0 var(--desk-edge),0 -14px 18px -14px rgba(0,0,0,.55)}
  .actions .stamps{flex:1}
  .actions .tray-btn{flex-direction:column;justify-content:center;gap:.2rem;padding:.4rem .75rem;font-size:.82rem}
  .stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
  @media (max-width:36rem){
    .stamps{grid-template-columns:1fr}
    .actions{position:static;flex-direction:column-reverse;box-shadow:none}
  }
  .stamp{border:2.5px solid;border-radius:6px;padding:.55rem .7rem;display:flex;
         flex-direction:column;align-items:center;justify-content:center;gap:.15rem;text-align:center;
         box-shadow:inset 0 0 0 2px var(--desk),inset 0 0 0 3.5px currentColor}
  .stamp-top{display:inline-flex;align-items:center;gap:.55rem}
  .stamp-face{font-family:"Courier Prime","Courier New",monospace;font-weight:700;font-size:.86rem;
              letter-spacing:.1em;text-transform:uppercase;line-height:1.3}
  .stamp-sub{font-size:.76rem;line-height:1.3;opacity:.9}
  .stamp kbd{font-family:"IBM Plex Sans",sans-serif;font-size:.62rem;opacity:.75;
             border:1px solid currentColor;border-radius:3px;padding:0 .3rem}
  .stamp.go{color:var(--stamp-go);background:var(--stamp-go-bg)}
  .stamp.red{color:var(--stamp-red);background:var(--stamp-red-bg)}
  .stamp.grey{color:var(--stamp-grey);background:var(--stamp-grey-bg)}
  .stamp.amber{color:var(--stamp-amber);background:var(--stamp-amber-bg)}
  .stamp:hover{filter:brightness(.97)}
  .stamp:active{transform:translateY(1px)}
  .acard,.clip{position:relative}
  .impression{position:absolute;top:22%;left:8%;transform:rotate(-11deg);pointer-events:none;
              border:4px double currentColor;border-radius:6px;padding:.35rem .8rem;
              font-family:"Courier Prime","Courier New",monospace;font-weight:700;
              font-size:1.25rem;letter-spacing:.14em;white-space:nowrap;
              mix-blend-mode:multiply;opacity:.92;animation:stampdown .16s cubic-bezier(.2,.9,.3,1.2) both}
  .impression.go{color:var(--stamp-go)}
  .impression.red{color:var(--stamp-red)}
  .impression.grey{color:var(--stamp-grey)}
  .impression.amber{color:var(--stamp-amber)}
  @keyframes stampdown{from{transform:rotate(-11deg) scale(1.4);opacity:0}to{transform:rotate(-11deg) scale(1);opacity:.92}}
  @media (prefers-reduced-motion:reduce){.impression{animation:none}}
  .closure{font-family:"Courier Prime",monospace;font-size:.8rem;color:var(--ui-faint);margin:-.4rem 0 0}
  .decided-line{font-family:"Courier Prime",monospace;font-size:.8rem;color:var(--ui-faint);margin:-.2rem 0 0}
  .tray-btn:disabled{opacity:.45;cursor:default}
  .reviewed-mark{position:absolute;right:.9rem;bottom:.8rem;transform:rotate(-6deg);
                 border:3px double var(--stamp-go);color:var(--stamp-go);border-radius:5px;padding:.25rem .6rem;
                 font-family:"Courier Prime",monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;
                 line-height:1.3;text-align:center;opacity:.85;pointer-events:none}

  .trayrow{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;font-size:.85rem;margin-top:.2rem}
  .tray-btn{display:inline-flex;align-items:center;gap:.45rem;padding:.5rem .8rem;border-radius:5px;
            border:1.5px solid var(--ui-dim);background:rgba(0,0,0,.12);color:var(--ui);font-size:.85rem}
  .tray-btn:hover{border-color:var(--ui);background:rgba(0,0,0,.2)}
  .tray-btn kbd{font-family:"IBM Plex Sans",sans-serif;font-size:.62rem;opacity:.7;
                border:1px solid currentColor;border-radius:3px;padding:0 .3rem}
  .quiet{background:none;border:none;padding:0;color:var(--ui-faint);font-size:.8rem;text-decoration:underline}
  .spacer{flex:1}
  /* where the reviewer is, above the question: the record, and the change
     within it, which was in faint type at the foot of the page */
  .kicker{margin:.35rem 0 -.6rem;font-size:.84rem;color:var(--ui-faint);letter-spacing:.01em}
  .kicker b{color:var(--ui);font-weight:600}
  /* the record a "create" would make, drawn on a card with a dashed edge:
     it does not exist yet */
  .acard.draft{outline:2px dashed var(--card-soft);outline-offset:-7px}
  .draft-note{font-family:"IBM Plex Sans",sans-serif;font-size:.8rem;line-height:1.45;color:var(--card-soft);margin:.3rem 0 0}
  .notewrap{display:flex;flex-direction:column;gap:.3rem}
  .note-line{font-size:.86rem;color:var(--ui);line-height:1.5;padding:.4rem .7rem;border-left:3px solid var(--ui-dim);background:rgba(0,0,0,.1);border-radius:0 4px 4px 0}
  .note-mark{font-family:"Courier Prime",monospace;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ui-faint)}
  .notewrap textarea,.editor{width:100%;min-height:3.4rem;font-family:inherit;font-size:.9rem;
      line-height:1.5;padding:.6rem .7rem;border-radius:4px;border:1.5px solid var(--ui-dim);
      background:var(--sheet);color:var(--sheet-ink);resize:vertical}
  .editor{font-family:"Courier Prime","Courier New",monospace;min-height:5rem}
  .editwrap{display:flex;flex-direction:column;gap:.4rem}
  .edit-label{font-family:"IBM Plex Sans",sans-serif;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ui-faint)}
  .result{font-family:"Courier Prime","Courier New",monospace;font-size:.86rem;line-height:1.5;padding:.6rem .8rem;
          border-radius:4px;background:var(--card);color:var(--card-ink);display:flex;flex-direction:column;gap:.2rem}
  .result-label{font-family:"IBM Plex Sans",sans-serif;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--card-soft)}

  .why{display:flex;flex-wrap:wrap;gap:.4rem}
  .chip{font-size:.8rem;padding:.3rem .7rem;border-radius:999px;border:1.5px solid var(--ui-dim);
        background:transparent;color:var(--ui);text-align:left}
  .chip span{opacity:.75}
  .chip.on{background:var(--sheet);color:var(--sheet-ink);border-color:var(--sheet)}

  .gist{display:flex;flex-direction:column;gap:.3rem}
  .gline{display:flex;gap:.5rem;font-size:.92rem;line-height:1.45;padding:.35rem .6rem;border-radius:3px;
         background:rgba(0,0,0,.05);color:var(--news-ink);font-family:Newsreader,Georgia,serif}
  .gline.add{border-left:3px solid var(--tick)}
  .gline.cut{border-left:3px solid var(--struck);text-decoration:line-through;opacity:.85}
  .gline.sub{border-left:3px solid var(--stamp-amber)}
  .gline .struck{color:var(--struck);text-decoration:line-through;opacity:.85}
  .gline .lead{font-style:italic;background:linear-gradient(transparent 62%,rgba(78,72,67,.22) 62% 88%,transparent 88%)}
  .gmark{font-family:"Courier Prime",monospace;font-weight:700}
  .gtext{flex:1}
  .gline.out .gtext,.vline.out .lead{text-decoration:line-through;opacity:.55}
  .gline.out{border-left-color:var(--news-rule)}
  .leave{color:var(--news-soft);font-size:.74rem;font-family:"IBM Plex Sans",sans-serif;white-space:nowrap;align-self:center}
  .leave:disabled{opacity:.4;text-decoration:none;cursor:default}

  .corrob{font-size:.9rem;color:var(--ui);padding:.55rem .8rem;border-radius:4px;
          background:rgba(0,0,0,.14);border-left:3px solid var(--tick);line-height:1.5;
          display:flex;flex-wrap:wrap;gap:.3rem .4rem;align-items:baseline}
  .corrob.conflict{border-left-color:#E0A84E}
  .cb-lead{font-weight:600}
  .corrob .quiet{color:var(--ui);font-size:.86rem;text-align:left}
  .corrob .why{width:100%;margin-top:.2rem}

  /* what the article proposes, on the clipping side; the record stays as it is */
  .proposal{border-top:2px solid var(--news-ink);margin-top:.35rem;padding-top:.55rem;
            display:flex;flex-direction:column;gap:.3rem;font-family:"IBM Plex Sans",sans-serif}
  .prop-label{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--news-soft)}
  .prop-value{font-family:Newsreader,Georgia,serif;font-size:1.02rem;line-height:1.45;color:var(--news-ink)}
  .prop-value .lead{font-style:italic;background:linear-gradient(transparent 62%,rgba(78,72,67,.22) 62% 88%,transparent 88%)}
  .prop-value .struck{color:var(--struck);text-decoration:line-through;opacity:.8}
  .prop-result{font-size:.8rem;color:var(--news-soft);line-height:1.45}
  .prop-result b{color:var(--news-ink);font-weight:600}

<script>window.__CARDS__=[];window.__INDEX__=[];window.__NPT__={};window.__NOTED__=[];</script>
<script>


const REAL = window.__CARDS__;
let CARDS = REAL;
const KEY = "tte-review-v5";
const LANG_KEY = "tte-languages";
const PRACTICE_KEY = "tte-desk-practice-v1";
// Which languages the reviewer reads, asked once at sign-in. Cards are not
// withheld on it: every card carries English, and a Tamil card with no Tamil
// reader must still be reviewable. It orders the deck, labels a card whose
// sources the reviewer cannot read, and is saved with each decision so a
// verdict made from the original can later be told from one made from the
// translation.
let langs = ["en"];
try { langs = JSON.parse(localStorage.getItem(LANG_KEY) || '["en"]'); } catch (e) {}
const LANG_NAMES = { en: "English", zh: "Chinese", ms: "Malay", ta: "Tamil" };
const langOf = link => /zaobao/.test(link) ? "zh" : /beritaharian/.test(link) ? "ms" : /tamilmurasu/.test(link) ? "ta" : "en";
const cardLangs = c => [...new Set((c.sources || []).map(s => langOf(s.link || "")))];
const readable = c => cardLangs(c).some(l => langs.includes(l));
// What to work on, asked at sign-in beside the languages: the second
// reviewer wanted the deck split so a librarian who knows organisations can
// take those. In the file version it is also how two reviewers divide the
// deck without a server. Null means everything.
const TYPE_KEY = "tte-types";
const GROUPS = [["people", "People", t => t === "PERSON"],
                ["organisations", "Organisations", t => t === "ORGANISATION"],
                ["legal acts", "Legal acts", t => t === "LEGAL_ACT"],
                ["everything else", "Everything else", t => true]];
const groupOf = c => GROUPS.find(g => g[2](c.type))[0];
let types = null;
try { types = JSON.parse(localStorage.getItem(TYPE_KEY) || "null"); } catch (e) {}
function orderDeck() {
  // A card this reviewer already holds first, whatever the settings say;
  // then the chosen groups, cards in the reviewer's languages before the
  // rest, each in the order they came (latest news first).
  if (practising) return;
  const held = REAL.filter(c => heldByMe.has(c.key));
  const pool = REAL.filter(c => !heldByMe.has(c.key) && (!types || types.includes(groupOf(c))) && !taken.has(c.key));
  CARDS = held.concat(pool.filter(readable), pool.filter(c => !readable(c)));
  CARDS.forEach((c, i) => { c.i = i; });
}
const NEW = "__new__";

// Rejecting every candidate can mean several different things, and which one
// it is matters. A homonym says retrieval worked and the entity is genuinely
// missing -- the new record will need disambiguating from its namesake.
// "Not there yet" says nothing about the records offered. "Can't tell" is an
// honest answer that should not be forced into either.
const REASONS = [
  ["homonym", "Same name, different person or thing"],
  ["absent", "Not in the knowledge base yet"],
  ["unsure", "Can't tell from what's here"],
];

let labels = {};
try { labels = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}

// Several librarians review the same proposals, so each writes under their own
// name. Without this they share one document per proposal and the second
// verdict silently overwrites the first.
const WHO_KEY = "tte-reviewer";
let reviewer = "";
try { reviewer = localStorage.getItem(WHO_KEY) || ""; } catch (e) {}
const slug = name => name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-")
                         .replace(/^-|-$/g, "").slice(0, 40);

// ---- online -----------------------------------------------------------------
// With `window.__ONLINE__` set (the site build), the deck comes from the
// `deck` table after sign-in, every decision goes to `reviews`, and a card
// is one reviewer's while they hold it (`claims`). Without it (the zip),
// everything stays in this browser, as before. The browser copy is kept
// online too, as a cache: a dropped connection loses nothing.
const ONLINE = window.__ONLINE__ || null;
let sb = null;          // the Supabase client, online only
let me = null;          // the signed-in user
let taken = new Set();  // cards another reviewer has decided or holds
let claimed = {};       // card key -> true (mine), false (someone else's)
let loading = "";       // a line to show while the deck is fetched
let others = 0;         // decisions by other reviewers, for the count
let bump = "";          // a card that left this desk, said once
let unsent = {};        // card key -> decision rows the table has not taken yet
let testing = false;    // a test account: looks at the real deck, writes nothing
let onTeam = false;     // the team page is showing
let allReviews = [];    // everyone's decisions, for the team page
let allHolds = [];      // every card on someone's desk
let STATUS = null;      // the pipeline's status, published with the deck
let heldByMe = new Set();  // cards this reviewer held when the deck was fetched
const NOTED = window.__NOTED__ || [];
if (ONLINE && window.supabase) {
  try { sb = window.supabase.createClient(ONLINE.url, ONLINE.anonKey); } catch (e) { sb = null; }
}
const whoAmI = user => (user.user_metadata && user.user_metadata.name) || (user.email || "").split("@")[0] || "reviewer";

// Paged in a fixed order: unordered pages can repeat or skip rows.
async function pageAll(table, columns, order) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from(table).select(columns).order(order).range(from, from + 999);
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < 1000) break;
  }
  return out;
}

// The search index and the noted list: one large file that only the search
// drawer and the last screen need, so it comes down while the first card is
// on the screen rather than before it.
async function loadDesk() {
  try {
    const { data } = await sb.storage.from("desk").download("desk.json");
    const text = data && data.text ? await data.text() : (typeof data === "string" ? data : "");
    const desk = text ? JSON.parse(text) : {};
    INDEX.length = 0; (desk.index || []).forEach(r => INDEX.push(r));
    Object.keys(NPT).forEach(k => delete NPT[k]); Object.assign(NPT, desk.npt || {});
    NOTED.length = 0; (desk.noted || []).forEach(n => NOTED.push(n));
    STATUS = desk.status || null;
    // Only a screen that reads it needs redrawing; a card being worked on is left alone.
    if (me && !loading && !showPrefs && (onTeam || at >= CARDS.length)) render();
  } catch (e) { /* search works without it; the card still does */ }
}

// After sign-in: the deck, everyone's decisions and holds, and the search
// index, all asked for at once: each is a round trip to a distant database.
async function loadOnline() {
  loading = "Fetching the deck…"; render();
  loadDesk();
  const [rows, reviews, holds] = await Promise.all([
    pageAll("deck", "key,card", "key"),
    pageAll("reviews", "pid,card_key,reviewer,decision", "pid"),
    pageAll("claims", "card_key,reviewer", "card_key"),
  ]);
  REAL.length = 0;
  // The table keeps no order of its own; the card builder's is latest news first.
  rows.map(r => r.card).sort((a, b) => a.i - b.i).forEach(c => REAL.push(c));
  labels = {}; taken = new Set(); others = 0;
  reviews.forEach(r => {
    if (r.reviewer === me.id) labels[r.pid] = r.decision;
    else { taken.add(r.card_key); others++; }
  });
  // A card someone else holds stays out of this deck; one this reviewer
  // already holds, from an earlier sitting, comes back first.
  allReviews = reviews; allHolds = holds;
  heldByMe = new Set(); claimed = {};
  holds.forEach(h => { if (h.reviewer === me.id) heldByMe.add(h.card_key); else taken.add(h.card_key); });
  // A decision the browser kept that the table lacks was written while the
  // connection was down; it goes up now.
  let cached = {};
  if (testing) { try { localStorage.removeItem(cacheKey()); } catch (e) {} }
  else { try { cached = JSON.parse(localStorage.getItem(cacheKey()) || "{}"); } catch (e) {} }
  // One decided by someone else meanwhile is theirs, and is dropped here.
  const byKey = {};
  REAL.forEach(c => c.pids.forEach(pid => { byKey[pid] = c.key; }));
  const late = Object.keys(cached).filter(pid => !labels[pid] && !taken.has(byKey[pid]));
  late.forEach(pid => { labels[pid] = cached[pid]; });
  const pending = late.filter(pid => byKey[pid]).map(pid => ({ pid: Number(pid), card_key: byKey[pid], reviewer: me.id,
                                                              verdict: cached[pid].verdict, decision: cached[pid] }));
  if (pending.length && !testing) Promise.resolve(sb.from("reviews").upsert(pending, { onConflict: "pid" })).then(r => {
    if (r && r.error) return;
    new Set(pending.map(p => p.card_key)).forEach(key => { Promise.resolve(sb.rpc("release_card", { key })).catch(() => {}); });
  }).catch(() => {});
  loading = "";
  keep();
}
// Online, the browser copy is per account, so two reviewers on one machine
// do not read each other's decisions.
const cacheKey = () => (me ? KEY + ":" + me.id : KEY);
// The browser's copy of the decisions. A test account keeps none: what it does
// is gone with the page.
function keep() {
  if (testing) return;
  try { localStorage.setItem(cacheKey(), JSON.stringify(labels)); } catch (e) {}
}

// Two people never work on the same record. A card is shown only once the
// table says it is this reviewer's, and it stays theirs until they stamp
// it; there is no expiry to watch. A claim refused means someone else has
// it: move on without a word. If the table cannot be reached, the desk
// says so and waits for the reviewer to try again; it never guesses.
function holdCard(c, ahead) {
  if (!sb || practising || testing || labels[c.pids[0]]) return;
  if (claimed[c.key] !== undefined) return;
  claimed[c.key] = "asking";
  // A card asked for ahead of time is not on the screen yet: its answer is
  // kept, and nothing is redrawn unless the reviewer has meanwhile reached it.
  const shown = () => !ahead || CARDS[at] === c;
  Promise.resolve(sb.rpc("claim_card", { key: c.key })).then(({ data, error }) => {
    claimed[c.key] = error ? "retry" : !!data;
    if (!shown()) return;
    if (data === false) at = firstUndecided();
    render();
  }).catch(() => { claimed[c.key] = "retry"; if (shown()) render(); });
}
// While a card is being worked on, the next one is checked out, so opening it
// does not wait on the table. It is still shown only once it is the reviewer's.
function holdNext() {
  for (let i = at + 1; i < CARDS.length; i++) {
    if (labels[CARDS[i].pids[0]] || !mine(CARDS[i])) continue;
    holdCard(CARDS[i], true);
    return;
  }
}
// The card stays held until its decision is in the table; only then is it
// let go. A dropped connection keeps both, and the renewal sends it again.
async function pushReview(c, entry) {
  if (!sb || practising || testing) return;
  unsent[c.key] = c.pids.map(pid => ({ pid, card_key: c.key, reviewer: me.id, verdict: entry.verdict, decision: labels[pid] }));
  await Promise.all(Object.keys(unsent).map(sendReview));
}
// The table keeps one decision per proposal. The holds above mean a second
// never arises; if one ever did, the table refuses it (a unique clash, or
// the policy barring a change to someone else's row) and the reviewer is
// told rather than left believing it saved.
const LOST = new Set(["23505", "42501"]);
async function sendReview(key) {
  const rows = unsent[key];
  if (!rows) return;
  let error = null;
  try { ({ error } = await sb.from("reviews").upsert(rows, { onConflict: "pid" })); } catch (e) { error = e || {}; }
  if (error && !LOST.has(error.code)) return;
  delete unsent[key]; delete claimed[key];
  Promise.resolve(sb.rpc("release_card", { key })).catch(() => {});
  if (error) {
    const c = REAL.find(x => x.key === key);
    if (c) lostTo(c);
  }
}
function lostTo(c) {
  c.pids.forEach(pid => { delete labels[pid]; });
  keep();
  taken.add(c.key); others++;
  bump = `The database already holds a decision on ${c.entity}, so yours was not kept.`;
  if (CARDS[at] === c) at = firstUndecided();
  render();
}
const mine = c => !taken.has(c.key) && claimed[c.key] !== false;

const DSTATE = {
  new: "not on the record",
  extra: "adds to what is there",
  differs: "different wording",
  same: "already recorded",
};

// "LEGAL_ACT" is a legal act on screen.
const kind = c => c.type.toLowerCase().replace(/_/g, " ");
// "The Straits Times, 28 Aug" from a source's link and date.
const OUTLET = [["straitstimes", "The Straits Times"], ["zaobao", "Lianhe Zaobao"], ["channelnewsasia", "CNA"]];
function outletOf(c, key) {
  const src = c.sources[sourceIndex(c, key)] || {};
  const host = (src.link || "").split("/")[2] || "";
  const name = (OUTLET.find(([k]) => host.includes(k)) || [null, host])[1] || src.article || "";
  const d = src.date ? new Date(src.date + "T00:00:00") : null;
  const when = d && !isNaN(d) ? d.toLocaleDateString("en-SG", { day: "numeric", month: "short" }) : "";
  return when ? `${name}, ${when}` : name;
}

// Sources are numbered once, under the headline, and referred to by
// number everywhere else, the way footnotes work: the names appear one
// time, not beside every value. A name or a number brings that source
// to the front of the clipping; the headline is the one thing that opens
// an article, and the only thing underlined.
function sourceTab(c, st, key, current, asNumber) {
  const i = sourceIndex(c, key);
  const src = c.sources[i] || {};
  const b = el("button", (asNumber ? "src-ref" : "src-tab") + (i === current ? " here" : ""));
  if (asNumber) b.textContent = String(i + 1);
  else b.append(el("sup", null, String(i + 1)), " " + outletOf(c, key));
  b.title = src.article ? `Show source ${i + 1}: ${src.article}` : "";
  b.onclick = () => { if (st) { st.clipAt = i; st.clipPinned = true; render(); } };
  return b;
}

// A name not written in Latin script. Its English form, if any, is the
// extractor's guess, and TTE may hold the record under another spelling.
const nonLatin = s => /[^\x00-\x7F\u00C0-\u024F\s.,'’()\-]/.test(String(s || ""));

const el = (t, cls, txt) => {
  const n = document.createElement(t);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};

function kv(pairs) {
  const dl = el("dl", "kv");
  pairs.forEach(f => {
    dl.append(el("dt", null, f.key));
    const dd = el("dd", f.value.length > 150 ? "clip" : null, f.value);
    if (f.value.length > 150) dd.onclick = e => { e.stopPropagation(); dd.classList.toggle("clip"); };
    dl.append(dd);
  });
  return dl;
}

// Per-card working state: which record, and which changes are ticked.
const draft = {};
function stateFor(c) {
  if (!draft[c.key]) {
    draft[c.key] = {
      // Nothing is pre-chosen: the identity question is asked outright rather
      // than defaulted into, which is where the homonym errors live.
      uid: null, no: {}, i: 0, tick: {}, edits: {},
      why: "", note: "", noteOpen: false,
    };
  }
  return draft[c.key];
}

// Every change the reviewer can act on, for whichever record is selected. The
// model's proposals belong to the record it matched; for any other candidate,
// and for anything it did not propose, the article's own facts are offered
// unticked -- it saw those fields and chose not to propose them.
// The model's own match is offered first even when another name scores higher:
// it is the only candidate anything has actually reasoned about.
function ordered(c) {
  return c.options.slice().sort((a, b) =>
    (b.uid === c.picked) - (a.uid === c.picked) || (b.similarity || 0) - (a.similarity || 0));
}

function rowsFor(c, st) {
  const chosen = c.options.find(o => o.uid === st.uid);

const keyOf = ch => ch.field + "|" + ch.strategy + "|" + ch.adding;
const isOn = (st, ch) => {

// The decisions, one per card: a card that settled two proposals wrote two
// labels, and counting labels once showed "139 of 116 reviewed".
const decided = () => CARDS.map(c => labels[c.pids[0]]).filter(Boolean);

function firstUndecided() {
  const i = CARDS.findIndex(c => !labels[c.pids[0]] && mine(c));
  return i === -1 ? CARDS.length : i;
}
let at = firstUndecided();

function save(c, verdict) {
  const st = stateFor(c);
  const entry = {
    verdict,
    entity: c.entity,
    chose: verdict === "reject" ? null : (st.uid === NEW ? "new-entity" : st.uid),
    // Whether the reviewer had to go and find the record themselves, which
    // says the retriever missed it.
    foundBySearch: !!st.foundBySearch,
    reason: st.uid === NEW ? (st.why || "") : "",
    note: st.note || "",
    changes: rowsFor(c, st).filter(ch => isOn(st, ch)).map(ch => ch.field),
    // The reviewer's own wording, where they rewrote a proposal rather than
    // rejecting it outright.
    edits: Object.fromEntries(rowsFor(c, st)
      .filter(ch => isOn(st, ch) && (st.edits || {})[keyOf(ch)] != null)
      .map(ch => [ch.field, st.edits[keyOf(ch)]])),
    dropped: rowsFor(c, st).filter(ch => !isOn(st, ch)).map(ch => ch.field),
    // Each accepted change with its current and proposed values and the
    // article it came from, so the approved-changes sheet can be written
    // after the page has been closed and reopened.
    rows: rowsFor(c, st).filter(ch => isOn(st, ch)).map(ch => ({
      field: ch.field,
      current: ch.strategy === "APPEND" ? (ch.existing || []).join(" | ")
             : (ch.diff ? ch.diff.filter(d => d.op !== "in").map(d => d.text).join(" ") : (ch.existing || []).join(" | ")),
      proposed: (st.edits || {})[keyOf(ch)] != null ? st.edits[keyOf(ch)] : ch.result,
      from: ch.from || (c.sources[0] || {}).link,

    record: st.uid === NEW ? "" : ((c.options.find(o => o.uid === st.uid) || {}).name || ""),
    reviewer,
    at: new Date().toISOString(),

  // several articles is one decision, recorded against each of them.
  entry.languages = langs.slice();

  // stamp, added to any earlier visit's.
  const earlier = (labels[c.pids[0]] || {}).seconds || 0;
  entry.seconds = earlier + (openedAt[c.key] ? Math.round((Date.now() - openedAt[c.key]) / 1000) : 0);
  delete openedAt[c.key];

  if (!practising) keep();
  bump = "";

}

// [uid, name, type, identity, opening of the description] for every canonical, active record.
const INDEX = window.__INDEX__ || [];
// Every non-preferred term by the record it names. Most candidates arrive
// through one of these, and a reviewer searching by the name an article used
// should find the record it is a variant of.
const NPT = window.__NPT__ || {};

const esc = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';

// Every decision, one row per proposal: what the pipeline needs back.
function csv() {
  const lines = [["proposal_id", "entity", "verdict", "chose", "found_by_search", "reason", "note",
                  "applied", "dropped", "seconds", "reviewer", "at"].join(",")];
  REAL.forEach(c => c.pids.forEach(pid => {
    const l = labels[pid];
    if (!l) return;
    lines.push([pid, c.entity, l.verdict, l.chose, l.foundBySearch ? "yes" : "", l.reason || "", l.note || "",
                (l.changes || []).join("; "), (l.dropped || []).join("; "), l.seconds == null ? "" : l.seconds, l.reviewer || reviewer, l.at]
               .map(esc).join(","));
  }));
  return lines.join("\n");
}

// Every accepted change, one row per attribute: what a cataloguer applies in
// TTE. The columns are the ones the first reviewer asked for.
function changesCsv() {
  const lines = [["TTE_UUID", "Entity", "Attribute", "Current_Value", "Proposed_Value",
                  "Article_URL", "Article_Title", "Article_Summary", "Person Who Approved"].join(",")];
  REAL.forEach(c => {
    const l = labels[c.pids[0]];
    if (!l || l.verdict !== "approve") return;
    const srcFor = key => c.sources[sourceIndex(c, key)] || c.sources[0] || {};
    const who = l.reviewer || reviewer;
    if (l.chose === "new-entity") {
      const src = c.sources[0] || {};
      lines.push(["NEW", c.entity, "Name", "", c.entityEn ? `${c.entity} (${c.entityEn})` : c.entity,
                  src.link, src.article, src.says, who].map(esc).join(","));
      (c.newsFields || []).forEach(f => lines.push(
        ["NEW", c.entity, f.key, "", f.value, src.link, src.article, src.says, who].map(esc).join(",")));
      return;
    }
    const rows = l.rows || [];
    if (!rows.length) {
      const src = c.sources[0] || {};
      lines.push([l.chose, c.entity, "(match confirmed)", l.record || "", "", src.link, src.article, src.says, who]
                 .map(esc).join(","));
    }
    // A Chinese name confirmed against an English record is a variant name
    // TTE does not hold: of 66 Chinese-named people in the feed, TTE had the
    // Chinese name for 17. Once the cataloguer adds it, the next article in
    // that language matches on it directly, with no spelling guessed.
    if (nonLatin(c.entity) && l.record && !nonLatin(l.record)) {
      const src = c.sources[0] || {};
      lines.push([l.chose, c.entity, "Variant name", "", c.entity, src.link, src.article, src.says, who]
                 .map(esc).join(","));
    }
    rows.forEach(r => {
      const src = srcFor(r.from);
      lines.push([l.chose, c.entity, r.field, r.current, r.proposed, src.link, src.article, src.says, who]
                 .map(esc).join(","));
    });
  });
  return lines.join("\n");
}

// A blob download, with the reviewer's name on the file. The byte-order
// mark is for Excel, which otherwise reads a UTF-8 sheet as ANSI and shows
// every Chinese name as noise.
function download(filename, data) {
  if (testing) return;
  const blob = new Blob(["\ufeff" + data], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename.replace(/\.csv$/, "") + "-" + (slug(reviewer) || "anon") + ".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const downloadCsv = () => download("review-decisions.csv", csv());
const downloadChanges = () => download("approved-changes.csv", changesCsv());

// ---------------------------------------------------------------------------
// The Clippings Desk.
//
// Before the pipeline, a librarian read the newspapers with scissors: cut the
// paragraph that mattered, pulled the drawer, found the authority card, and
// pencilled a line on it or typed a new one. This is that desk. Every screen
// the review app asks is one physical action here, and nothing is scored:
// there is no clock, no quota and no wage, because the judgement being asked
// for is the kind those things ruin.
// ---------------------------------------------------------------------------

const TUTORIAL_KEY = "tte-desk-tutorial-v1";
let KEYS = {};

// Fields shown on both documents, in the same order, so a mismatch is
// something you see rather than something you work out.
const LINES = ["Occupation", "Title", "Affiliations(groupName)", "Awards",
               "Nationality", "Birth Year (yyyy)", "Death Year (yyyy)", "Country",
               "Parent Organisation", "Feature Type", "Street Address"];
// How a field is named inside a question: "Set the birth year to this?",
// not "Set Born to this?".
const ASK_NAME = {"Birth Year (yyyy)": "the birth year", "Death Year (yyyy)": "the death year",
                  "Year Started (yyyy)": "the year started", "Year Ended (yyyy)": "the year ended",
                  "Street Address": "the address", "Parent Organisation": "the parent organisation"};
const SHORT = {"Affiliations(groupName)": "Affiliations",
               "Birth Year (yyyy)": "Born", "Death Year (yyyy)": "Died",
               "Parent Organisation": "Parent org.", "Feature Type": "Type",
               "Street Address": "Address"};

// The same fact on both papers, so hovering one lights the other.
let lineEls = {};

function fieldMap(pairs) {
  const m = {};
  (pairs || []).forEach(f => { if (f.key) m[f.key] = f.value; });
  return m;
}

// ---- documents -------------------------------------------------------------

// The newspaper clipping: what the article says, on newsprint.
// Which clipping to show. One at a time, always: the identity question needs
// one good sentence, not four articles, and a pencil note needs the clipping
// that produced it. The rest wait in a stack behind, a flip away.
// A source is named by its link; older data named it by headline.
const sourceIndex = (c, key) => c.sources.findIndex(s => s.link === key || s.article === key);
function clipFor(c, st, ch) {
  if (st && st.clipPinned && st.clipAt != null) return Math.min(st.clipAt, c.sources.length - 1);
  if (ch) {
    const i = sourceIndex(c, ch.from || (c.newsFrom || {})[ch.field]);
    if (i >= 0) return i;
  }
  return Math.min((st && st.clipAt) || 0, c.sources.length - 1);
}

function clipping(c, o, idx, st, proposal) {
  // The field the proposal is about is stated in full below; the line for
  // it here would say the same thing twice.
  const newsFields = proposal ? (c.newsFields || []).filter(f => f.key !== proposal.field) : c.newsFields;
  idx = idx || 0;
  const src = c.sources[idx] || {};
  const doc = el("div", "clip");
  doc.append(el("div", "panel-label", "In the news"));
  // The masthead is the article's headline, and it opens the article. A
  // clipping you cannot check against its source is an assertion, not
  // evidence.
  const mast = el("div", "clip-mast");
  if (src.link) {
    const a = el("a", "clip-link", src.article || "Read the article");
    a.href = src.link; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.title = "Open the article in a new tab";
    mast.append(a, el("span", "clip-ext", " \u2197"));
  } else {
    mast.textContent = src.article || "Singapore news";
  }
  doc.append(mast);
  if (c.sources.length > 1) {
    // Every source as a tab; the one on view is marked, the others a
    // click away. The headline above opens whichever is on view.
    const all = el("div", "clip-sources");
    all.append("Sources: ");
    c.sources.forEach((s2, j) => {
      if (j) all.append(" · ");
      all.append(sourceTab(c, st, s2.link, idx));
      // The arrow opens that article directly; the name only brings it forward.
      const open = el("a", "clip-link src-open", "\u2197");
      open.href = s2.link; open.target = "_blank"; open.rel = "noopener noreferrer";
      open.title = "Open: " + (s2.article || s2.link);
      all.append(open);
    });
    doc.append(all);
  }
  doc.append(el("h2", "clip-head", c.entityEn ? `${c.entity} (${c.entityEn})` : c.entity));
  // A change may carry its own sentence from this article: the one the person
  // was given can back a different fact (her awards, under her new post).
  const own = proposal && (proposal.quotes || {})[src.link];
  const quote = own ? own.quote : src.quote, original = own ? own.original : src.original;
  if (original && original !== quote) {
    // The sentence as printed first, its translation under it in a lighter
    // hand: the translation is the model's, the sentence is the paper's.
    doc.append(el("p", "clip-body", "“" + original + "”"));
    if (quote) doc.append(el("p", "clip-body translated", quote));
  } else if (quote) doc.append(el("p", "clip-body", "“" + quote + "”"));
  else if (c.newsSays) doc.append(el("p", "clip-body", c.newsSays));
  doc.append(lines(fieldMap(newsFields), o ? fieldMap(o.fields) : {}, "news", null, proposal && proposal.field));
  if (proposal) doc.append(proposalBlock(proposal, c, st, idx));
  else if (c.isNew && c.newsLinked) Object.entries(c.newsLinked).forEach(([f, list]) => { if (list && list.length) doc.append(linkedNote(f, list)); });
  return doc;
}

// What the article proposes, stated on the clipping: the attribute, the value
// in pencil, and what the field would read afterwards. The record on the
// right is never drawn on; the first reviewer could not tell the proposal
// from the record when it was.
// A rewrite changes the existing text when it removes or replaces anything.
const changesText = ch => !!(ch.diff && ((ch.drops && ch.drops.length) || (ch.subs && ch.subs.length)));

// The pieces of a proposal a reviewer can take or leave one by one: the
// values of a list field, or the sentences added to a description. The
// second reviewer asked what to do when only part of an amendment is wanted;
// the answer is to leave the rest out and accept, with nothing to type.
function partsOf(ch) {
  if (ch.strategy === "APPEND") return ch.adding.split(" | ").map(x => x.trim()).filter(Boolean);
  if (ch.diff && !changesText(ch)) {
    return (ch.adds && ch.adds.length) ? ch.adds : ch.diff.filter(d => d.op === "in").map(d => d.text);
  }
  return [];
}
const leftOut = (st, ch) => ((st.left || {})[keyOf(ch)] || []);
function leaveOut(ch, st, part) {
  const k = keyOf(ch);
  const left = (st.left || (st.left = {}))[k] || (st.left[k] = []);
  const i = left.indexOf(part);
  if (i >= 0) left.splice(i, 1); else left.push(part);
  const keep = partsOf(ch).filter(p => !left.includes(p));
  const joiner = ch.strategy === "APPEND" ? " | " : " ";
  // What is kept becomes the reviewer's wording, the same way an edit does,
  // so the sheets carry it without knowing how it came about.
  if (left.length) {
    (st.editText || (st.editText = {}))[k] = keep.join(joiner);
    (st.edits || (st.edits = {}))[k] = editUnit(ch).compose(keep.join(joiner));
  } else {
    if (st.editText) delete st.editText[k];
    if (st.edits) delete st.edits[k];
  }
  render();
}
function leaveOutButton(ch, st, part) {
  const left = leftOut(st, ch);
  const out = left.includes(part);
  const last = !out && partsOf(ch).length - left.length <= 1;
  const b = el("button", "quiet leave", out ? "put back" : "leave out");
  b.title = last ? "To add nothing, stamp NO CHANGE" : (out ? "Add this after all" : "Accept the rest without this");
  b.disabled = last;
  b.onclick = () => { if (!last) leaveOut(ch, st, part); };
  return b;
}
function leftLine(ch, st) {
  const left = leftOut(st, ch);
  if (!left.length) return null;
  const n = partsOf(ch).length, unit = ch.strategy === "APPEND" ? "value" : "line";
  return el("div", "prop-result", `${n - left.length} of ${n} ${unit}s will be added; ${left.length} left out.`);
}

function proposalBlock(ch, c, st, current) {
  const box = el("div", "proposal");
  const cuts = changesText(ch);
  const verb = ch.strategy === "APPEND" ? "Add to" : (ch.diff ? (cuts ? "Rewrite" : "Add to") : "Set");
  box.append(el("div", "prop-label", `${verb} ${SHORT[ch.field] || ch.field}`));
  const v = el("div", "prop-value");
  const left = leftOut(st, ch);
  if (ch.diff) {
    // What comes in and what goes out, one line each, marked. The full
    // diff follows only when something is removed, so the reviewer can see
    // where; a pure addition needs no wall of text.
    const g = el("div", "gist");
    // An addition already shown inside a replacement is not listed twice.
    const inSub = t => (ch.subs || []).some(sb => sb.now.includes(t) || t.includes(sb.now));
    (ch.adds || []).filter(t => !inSub(t)).forEach(t => {
      const l = el("div", "gline add" + (left.includes(t) ? " out" : ""));
      l.append(el("span", "gmark", "+"), el("span", "gtext", t));
      if (!cuts) l.append(leaveOutButton(ch, st, t));
      g.append(l);
    });
    // A replacement is shown as was → now, so a changed year or a joined
    // sentence is a line of its own and not something to find in the text.
    (ch.subs || []).forEach(sb => {
      const l = el("div", "gline sub");
      l.append(el("span", "gmark", "~"), el("span", "struck", sb.was), el("span", null, " → "), el("span", "lead", sb.now));
      g.append(l);
    });
    (ch.drops || []).forEach(t => { const l = el("div", "gline cut"); l.append(el("span", "gmark", "−"), el("span", null, t)); g.append(l); });
    if (!g.children.length) {
      ch.diff.filter(d => d.op === "in").forEach(d => {
        const l = el("div", "gline add" + (left.includes(d.text) ? " out" : ""));
        l.append(el("span", "gmark", "+"), el("span", "gtext", d.text));
        if (!cuts) l.append(leaveOutButton(ch, st, d.text));
        g.append(l);
      });
    }
    v.append(g);
    if (cuts) {
      const full = el("div", "prop-result");
      ch.diff.forEach(part => {
        if (part.op === "same") full.append(el("span", "typed", part.text + " "));
        else if (part.op === "in") full.append(el("span", "lead", part.text + " "));
        else full.append(el("span", "struck", part.text + " "));
      });
      box.append(v, full);
      return box;
    }
  } else if (ch.strategy === "REPLACE" && (ch.existing || []).length) {
    // A value replaced: the old one struck, the new in pencil.
    v.append(el("span", "struck", ch.existing.join(" | ")), " ", el("span", "lead", ch.adding));
  } else if (ch.strategy === "APPEND" && ch.adding.includes(" | ")) {
    // Several values: grouped by what TTE holds, one label per group, so
    // the same badge is not printed after every value. The source numbers
    // stay with their value.
    const flags = {};
    (ch.inTTE || []).forEach(a => { flags[a.name] = a; });
    const many = (ch.supporters || []).length > 1;
    const values = ch.perValue || ch.adding.split(" | ").map(x => ({ value: x.trim(), sources: [] }));
    const groups = { ok: [], no: [], none: [] };
    values.forEach(pv => {
      const a = flags[pv.value];
      groups[a ? (a.uid ? "ok" : "no") : "none"].push({ pv, a });
    });
    [["ok", "in TTE"], ["no", "not in TTE yet"], ["none", ""]].forEach(([g, label]) => {
      if (!groups[g].length) return;
      const sec = el("div", "vgroup");
      if (label && ch.inTTE) sec.append(el("span", "badge " + g, label));
      groups[g].forEach(({ pv, a }) => {
        const line = el("div", "vline" + (left.includes(pv.value) ? " out" : ""));
        line.append(el("span", "lead", pv.value));
        if (a && a.wrote) line.append(el("span", "near-as", " · the article wrote: " + a.wrote));
        if (a && a.nearest) {
          line.append(el("span", "near-as", " · nearest: " + a.nearest + ", may be a different thing "));
          line.append(useName(ch, pv.value, a.nearest));
        }
        if (many && pv.sources.length) {
          const who = el("sup", "src-refs");
          pv.sources.forEach(t => who.append(sourceTab(c, st, t, current, true)));
          line.append(who);
        }
        line.append(" ", leaveOutButton(ch, st, pv.value));
        sec.append(line);
      });
      v.append(sec);
    });
    box.append(v);
    const kept = leftLine(ch, st);
    if (kept) box.append(kept);
    if ((ch.existing || []).length) {
      box.append(el("div", "prop-result", `Added to the ${ch.existing.length} already on the record, under In TTE today.`));
    }
    return box;
  } else {
    v.append(el("span", "lead", ch.adding));
  }
  (ch.inTTE || []).forEach(a => {
    v.append(badge(a));
    if (a.wrote) v.append(el("span", "near-as", " · the article wrote: " + a.wrote));
    if (a.nearest) v.append(el("span", "near-as", " "), useName(ch, a.name, a.nearest));
  });
  box.append(v);
  if (ch.strategy === "APPEND" && (ch.existing || []).length) {
    box.append(el("div", "prop-result", `Added to the ${ch.existing.length} already on the record, under In TTE today.`));
  } else if (ch.diff) {
    const kept = leftLine(ch, st);
    if (kept) box.append(kept);
    box.append(el("div", "prop-result", "Added to the description as it stands; nothing removed or changed."));
  }
  return box;
}

// One click to take the nearest record's name instead of the article's,
// for a reviewer who has judged them the same thing. It is an edit of the
// value, so it shows in the sheet as the reviewer's wording.
function useName(ch, from, to) {
  const b = el("button", "quiet use-name", "use this name");
  b.title = `Propose "${to}" instead of "${from}"`;
  b.onclick = () => {
    const st = stateFor(CARDS[at]);
    const k = keyOf(ch);
    const unit = editUnit(ch);
    const draft = ((st.editText || {})[k] != null ? st.editText[k] : unit.text).split(from).join(to);
    (st.editText || (st.editText = {}))[k] = draft;
    (st.edits || (st.edits = {}))[k] = unit.compose(draft);
    (st.open || (st.open = {}))[k] = true;
    render();
  };
  return b;
}

// An award or organisation a record would carry must itself be a TTE
// record; the badge says whether it is, and under what name when TTE
// spells it differently, so a missing one is created rather than
// forgotten and a present one is not created twice.
function badge(a) {
  // in TTE: the name itself. in TTE as: the same thing in TTE's house
  // style ("Singapore. Ministry of Health"). not in TTE yet: nothing by that
  // name; a different-looking record that is merely close is named as a
  // hint, since "Inspiring Teacher Award" was nearest to a different award.
  const cls = a.uid ? "ok" : "no";
  const text = a.uid ? "in TTE"
                     : (a.nearest ? "not in TTE yet · nearest: " + a.nearest : "not in TTE yet");
  const b = el("span", "badge " + cls + (a.as || a.nearest ? " long" : ""), text);
  b.title = a.uid ? `${a.name}: TTE record ${a.uid}` + (a.as ? `, named "${a.as}"` : "")
                  : (a.nearest ? `No record named "${a.name}". The nearest, "${a.nearest}" (${a.nearest_uid}), may be a different thing.`
                               : `${a.name}: no TTE record by this name`);
  return b;
}
const LINKED_LABEL = {"Awards": "Awards named", "Affiliations(groupName)": "Organisations named",
                      "Parent Organisation": "Parent organisation named"};
function linkedNote(field, list) {
  const box = el("div", "proposal");
  box.append(el("div", "prop-label", LINKED_LABEL[field] || field));
  list.forEach(a => { const v = el("div", "prop-value", a.name); v.append(badge(a)); box.append(v); });
  return box;
}

// The authority card: what TTE holds, typed on an index card, as it is.
function authorityCard(c, o, focus) {
  const doc = el("div", "acard");
  // A record already decided carries who decided it and when, and what:
  // every change ends at a named person, and the paper says so.
  const done = labels[c.pids[0]];
  if (done && !practising) {
    const when = done.at ? new Date(done.at).toLocaleDateString("en-SG", { day: "numeric", month: "short" }) : "";
    const verdict = { approve: "reviewed", reject: "rejected", unsure: "kept for review" }[done.verdict] || done.verdict;
    doc.append(el("div", "reviewed-mark", `${verdict} · ${done.reviewer || reviewer}${when ? " · " + when : ""}`));
  }
  doc.append(el("div", "panel-label", "In TTE today"));
  const top = el("div", "acard-top");
  top.append(el("span", "acard-type", c.type));
  top.append(el("span", "acard-uid", o ? "no. " + o.uid : ""));
  doc.append(top);
  doc.append(el("h2", "acard-name", o ? o.name : " "));
  if (o && o.npt) doc.append(el("div", "acard-npt", "NPT " + o.npt));
  const of = o ? fieldMap(o.fields) : {};
  doc.append(lines(of, fieldMap(c.newsFields), "card", focus));
  const desc = of["Description"];
  if (desc) {
    doc.append(el("p", "acard-desc" + (focus === "Description" ? " hi" : ""), desc));
  } else if (focus === "Description") {
    // The attribute being added, shown absent, so the reviewer can see
    // there is nothing there yet.
    doc.append(el("p", "acard-desc blank", "—"));
  }
  if (o && o.thin) {
    doc.append(el("p", "acard-desc blank", o.failed ? "The rest of this record could not be loaded."
      : sb ? "Loading the record…" : "Only the opening of the description is held for a record found by search."));
  }
  // The name-similarity score is not shown: it orders the candidates, and
  // on the card it was a model's number where a librarian reads a record.
  return doc;
}

// The aligned field lines. `mine` is this document's values, `theirs` the
// other document's, so a shared value gets a tick and an absent one a dash.
function lines(mine, theirs, side, focus, omit) {
  const dl = el("dl", "lines");
  // The fixed order first, then anything else either document carries, then
  // whatever the pencil is about to touch. A note on Nationality had nowhere
  // to land because Nationality was not in the fixed list.
  const skip = new Set(["Description", "Name", "Name (DisplayName)", "Name (LCNA)", "SN",
                        "Image Link", "DBpedia URI"]);
  const extra = [...new Set([...Object.keys(mine), ...Object.keys(theirs)])]
    .filter(f => !LINES.includes(f) && !skip.has(f)).sort();
  const order = LINES.concat(extra);
  if (focus && focus !== "Description" && !order.includes(focus)) order.push(focus);
  order.forEach(f => {
    if (f === omit) return;
    const v = mine[f], w = theirs[f];
    // The attribute in question is always shown, with a dash when the
    // record has nothing: a reviewer asked to add an affiliation could not
    // tell whether the record already had one.
    if (!v && !w && f !== focus) return;
    const dt = el("dt", null, SHORT[f] || f);
    const dd = el("dd", f === focus && side === "card" ? "hi" : null);
    (lineEls[f] = lineEls[f] || []).push(dd);
    dd.onmouseenter = () => lineEls[f].forEach(x => x.classList.add("hi"));
    dd.onmouseleave = () => lineEls[f].forEach(x => x.classList.remove("hi"));
    if (v) {
      dd.textContent = v;
      if (w && agree(v, w)) dd.append(el("span", "tick", " ✓"));
    } else {
      dd.append(el("span", "blank", "—"));
    }
    dl.append(dt, dd);
  });
  return dl;
}

function agree(a, b) {
  const split = s => new Set(String(s).split("|").map(x => x.trim().toLowerCase()).filter(Boolean));
  const A = split(a), B = split(b);
  for (const x of A) if (B.has(x)) return true;
  return false;
}

// [class, face, key, action]; anything after is ignored.
// The stamp lands on the document for the instant before the next screen:
// the mark is drawn, the action runs in the same tick, and the next render
// replaces it. Confirmation that a press registered is the one thing the
// animation was ever for; there is no wait on the action.
// The next screen follows 160 ms later, the length of the animation; a
// press during that moment is ignored rather than counted twice.
let stamping = false;
function impress(where, mark, cls, then) {
  const paper = document.querySelector(where === "card" ? ".acard" : ".clip");
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!paper || reduce) { then(); return; }
  paper.append(el("div", "impression " + cls, mark));
  thunk();
  stamping = true;
  setTimeout(() => { stamping = false; then(); }, 160);
}
let soundOn = false;
try { soundOn = localStorage.getItem("tte-desk-sound") === "1"; } catch (e) {}
let audio = null;
function thunk() {
  if (!soundOn) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audio = audio || new AC();
    const t = audio.currentTime;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.12);
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.18);
  } catch (e) {}
}

// [class, face, key, action, paper it lands on, the mark it leaves, a line
// under the face saying what happens next]. The stamps go in a bar held at
// the foot of the window, so they are on screen whatever the documents'
// length; the tray's one button joins them there.
function stamps(stage, list) {
  const bar = el("div", "actions");
  const row = el("div", "stamps");
  KEYS = {};
  list.forEach(([cls, label, key, fn, where, mark, sub]) => {
    const go = () => { if (stamping) return; if (where) impress(where, mark || label, cls, fn); else fn(); };
    KEYS[key.toLowerCase()] = go;
    const b = el("button", "stamp " + cls);
    const top = el("span", "stamp-top");
    top.append(el("span", "stamp-face", label), el("kbd", null, key));
    b.append(top);
    if (sub) b.append(el("span", "stamp-sub", sub));
    b.onclick = go;
    row.append(b);
  });
  bar.append(row);
  stage.append(bar);
}

// Beside the stamps: one step back, a real button with a key, because
// "← back" as small underlined text was missed.
function tray(stage, c, st) {
  const button = (label, key, fn) => {
    const b = el("button", "tray-btn");
    b.append(el("span", null, label));
    if (key) b.append(el("kbd", null, key));
    b.onclick = fn;
    if (key) KEYS[key.toLowerCase()] = fn;
    return b;
  };
  const stepBack = () => {
    if (st.i > 0) { st.i -= 1; return render(); }
    if (st.uid != null) { st.uid = null; st.i = 0; return render(); }
    const rejected = Object.keys(st.no);
    if (rejected.length) { delete st.no[rejected[rejected.length - 1]]; return render(); }
    at = Math.max(at - 1, 0); render();
  };
  // Nothing to undo on a card's first screen when no earlier record is on
  // the desk: the button says so instead of doing nothing. The team asked
  // that records not be skipped, so the tray is undo and nothing else;
  // any record is reopened from the sheet.
  const nothing = st.i === 0 && st.uid == null && !Object.keys(st.no).length && at === 0;
  const back = button("\u2190 Back one step", "Backspace", nothing ? () => {} : stepBack);
  if (nothing) { back.disabled = true; back.title = "Nothing to undo yet"; }
  const bar = stage.querySelector(".actions");
  if (bar) bar.prepend(back); else stage.append(back);
}

function drawer(c, st, current, label) {
  const d = el("div", "drawer");

  ordered(c).forEach(o => {

function renderHits(box, card, st) {

  if (q.length < 2) { box.append(el("div", "nohits", "Type at least two letters.")); return; }
