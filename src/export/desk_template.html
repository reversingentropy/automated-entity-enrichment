  // Name first, then the names it is also known by (NPTs), then the
  // identity line (occupation, description), so a reviewer who knows the
  // person chaired the NEA finds him whatever his name was rendered as.
  // Within each, a word that starts with what was typed comes before a
  // match inside a word: "Lee" listed Jubilee Church above every Lee.
  const via = {};
  const wordStart = new RegExp("(^|[^\\p{L}\\p{N}])" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "u");
  const starts = t => wordStart.test(String(t || "").toLowerCase());
  const has = t => String(t || "").toLowerCase().includes(q);
  const byNpt = test => row => {
    const n = (NPT[row[0]] || []).find(test);
    if (n) via[row[0]] = n;
    return !!n;
  };
  const passes = [row => starts(row[1]), byNpt(starts), row => has(row[1]), byNpt(has),
                  row => starts(row[3]) || starts(row[4]), row => has(row[3]) || has(row[4])];
  for (const pass of passes) {
    for (const row of INDEX) {
      if (found.length === 25) break;
      if (row[2] !== card.type || found.includes(row)) continue;
      if (pass(row)) found.push(row);
    }
  }
  if (!found.length) { box.append(el("div", "nohits", `No ${kind(card)} record by that name.`)); return; }
  found.forEach(row => {
    const b = el("button", "hit");
    b.append(el("b", null, row[1]));
    if (via[row[0]]) b.append(el("span", "npt", "NPT " + via[row[0]]));
    if (row[3]) b.append(el("span", null, row[3]));
    b.onclick = () => {
      if (!card.options.some(o => o.uid === row[0])) {
        // The index holds a name and an identity line; the rest of the record
        // is fetched when it is shown (loadRecord).
        const gist = row[4] || row[3];
        card.options.push({ uid: row[0], name: row[1], npt: via[row[0]] || undefined,
                            fields: gist ? [{ key: "Description", value: gist }] : [],
                            similarity: null, extra: [], thin: true });
      }
      st.peek = row[0]; st.finding = false; st.query = ""; st.foundBySearch = true;
      render();
    };
    box.append(b);
  });
}

// ---- screens ---------------------------------------------------------------


// What a decision came to, in the words the second reviewer asked for: how
// many to create, how many to amend. A verdict alone does not say; "approve"
// on a new entity is a record to create and on a matched one it is either
// an amendment or a confirmation.
const OUTCOMES = ["same", "amended", "to create", "not worth", "kept for review"];
function outcome(l) {
  if (!l) return "";
  if (l.verdict === "unsure") return "kept for review";
  // "Not this record" is never final: it moves to the next candidate, and
  // the card ends at create, not worth or kept for review.
  if (l.verdict === "reject") return "not worth";
  if (l.chose === "new-entity") return "to create";
  return (l.changes || []).length ? "amended" : "same";
}
function tally() {
  const n = {};
  decided().forEach(l => { const o = outcome(l); n[o] = (n[o] || 0) + 1; });
  return OUTCOMES.filter(o => n[o]).map(o => `${n[o]} ${o}`);
}

let theme = "";
try { theme = localStorage.getItem("tte-desk-theme") || ""; } catch (e) {}
function applyTheme() {
  if (document.documentElement) document.documentElement.setAttribute("data-theme", theme || "");
}
applyTheme();

let onSheet = false;

let showPrefs = false;
// When each card first came onto the desk this session, for the time a
// decision took: the number the team asked for against their own reading.
let openedAt = {};

function render() {
  const stage = document.getElementById("stage");
  stage.replaceChildren();
  lineEls = {};
  // The masthead's buttons and menu are for a signed-in desk only.
  const out = !!loading || (ONLINE && !me) || !reviewer || showPrefs;
  if (document.body) document.body.classList[out ? "add" : "remove"]("signed-out");
  if (loading) { stage.append(el("p", "hint", loading)); return; }
  if (ONLINE && !me) return authForm(stage);
  if (!reviewer || showPrefs) return signIn(stage);
  const done = decided().length;
  const soundBtn = document.getElementById("sound");
  if (soundBtn) {
    soundBtn.textContent = soundOn ? "Sound: on" : "Sound: off";
    soundBtn.onclick = () => { soundOn = !soundOn; try { localStorage.setItem("tte-desk-sound", soundOn ? "1" : "0"); } catch (e) {} render(); };
  }
  const themeBtn = document.getElementById("theme");
  if (themeBtn) {
    themeBtn.textContent = theme === "light" ? "Brown desk" : "Light desk";
    themeBtn.onclick = () => { theme = theme === "light" ? "" : "light"; try { localStorage.setItem("tte-desk-theme", theme); } catch (e) {} applyTheme(); render(); };
  }
  const sheetBtn = document.getElementById("sheet");
  if (sheetBtn) {
    sheetBtn.textContent = onSheet ? "Back to the desk" : "Your sheet";
    sheetBtn.onclick = () => { onSheet = !onSheet; onTeam = false; render(); };
  }
  const teamBtn = document.getElementById("team");
  if (teamBtn) {
    teamBtn.style.display = sb && me ? "" : "none";
    teamBtn.textContent = onTeam ? "Back to the desk" : "The team";
    teamBtn.onclick = () => { onTeam = !onTeam; onSheet = false; if (onTeam) refreshTeam(); render(); };
  }
  // Help lives here, away from the buttons that decide anything.
  const helpBtn = document.getElementById("help");
  if (helpBtn) {
    helpBtn.textContent = "How this works";
    helpBtn.onclick = () => showTutorial(true);
    KEYS.h = () => showTutorial(true);
  }
  const found = decided().filter(l => l.foundBySearch).length;
  document.getElementById("count").textContent = practising
    ? `practice ${Math.min(at + 1, CARDS.length)} of ${CARDS.length}`
    : `${done} of ${CARDS.length} records reviewed` + (found ? ` · ${found} found by search` : "")
      + (others ? ` · ${others} decided by others` : "");
  const outcomesLine = document.getElementById("outcomes");
  if (outcomesLine) outcomesLine.textContent = practising ? "" : tally().join(" · ");
  const whoBox = document.getElementById("who");
  if (whoBox) whoBox.textContent = reviewer;
  const meBox = document.getElementById("me");
  if (meBox) {
    meBox.replaceChildren();
    const prefs = el("button", null, "Settings");
    prefs.title = "Languages you read and what to work on";
    prefs.onclick = () => { showPrefs = true; onSheet = false; render(); };
    const swap = el("button", null, "Sign out");
    swap.onclick = () => {
      reviewer = ""; try { localStorage.removeItem(WHO_KEY); } catch (e) {}
      // Signing out keeps the card on the desk: it is still this reviewer's
      // and comes back first at the next sign-in.
      if (sb) { Promise.resolve(sb.auth.signOut()).catch(() => {}); me = null; testing = false; labels = {}; claimed = {}; unsent = {}; REAL.length = 0; CARDS = REAL; }
      render();
    };
    meBox.append(prefs, swap);
  }
  document.getElementById("bar").style.width = (done / CARDS.length * 100) + "%";
  if (testing) stage.append(el("p", "decided-line", "Test account: look around freely. Nothing you do "
    + "here is saved, and no card is held, so real reviewers never lose a record to it."));
  if (onTeam && !practising && sb && me) return teamPage(stage);
  if (onSheet && !practising) return sheetPage(stage);
  if (bump) stage.append(el("p", "decided-line", bump));
  if (at >= CARDS.length) return practising ? practiceOver(stage) : endOfShift(stage);

  const c = CARDS[at];
  const st = stateFor(c);
  // Online, the card is held while it is on the desk; a refusal moves on.
  holdCard(c);
  if (claimed[c.key] === "asking") { stage.append(el("p", "hint", "One moment…")); return; }
  if (claimed[c.key] === "retry") {
    stage.append(el("p", "hint", "Can't reach the desk, so this record can't be checked out to you yet."));
    const again = el("button", "stamp grey");
    again.append(el("span", "stamp-face", "Try again"));
    again.onclick = () => { delete claimed[c.key]; render(); };
    stage.append(again);
    return;
  }
  if (claimed[c.key] === false) { at = firstUndecided(); return at >= CARDS.length ? endOfShift(stage) : render(); }
  holdNext();
  // Back into a record already decided says so, and how to change it:
  // going back used to land on its last screen with no word of the decision.
  if (!practising && labels[c.pids[0]]) {
    stage.append(el("p", "decided-line", `Decided: ${outcome(labels[c.pids[0]])} \u00b7 stamp again to change it`));
  }
  if (!openedAt[c.key]) openedAt[c.key] = Date.now();
  // Every ten records, one line: a place to stop, and the number that
  // matters. Not a sheet, nothing to dismiss.
  if (!practising && done && done % 10 === 0 && !labels[c.pids[0]]) {
    stage.append(el("p", "closure", `${done} reviewed · ${CARDS.length - done} to go`
      + (found ? ` · ${found} record${found > 1 ? "s" : ""} found by search that retrieval missed` : "")));
  }
  if (st.uid == null) {
    // An entity the model found no record for starts at "create one?", with
    // the nearest names in the drawer for a reviewer who knows better.
    if (c.isNew && !st.peek) return renderNone(stage, c, st);
    const next = st.peek ? c.options.find(o => o.uid === st.peek)
                         : ordered(c).find(o => !st.no[o.uid]);
    return next ? renderWho(stage, c, st, next) : renderNone(stage, c, st);
  }
  if (st.uid === NEW) return renderNone(stage, c, st);
  const rows = rowsFor(c, st);
  // Coming back to a card that was already filed lands on its last note, not
  // on the stamp: stamping is something a hand does, never something a
  // re-render does. That loop was "back" showing FILED forever.
  if (!rows.length) { st.uid = null; return render(); }
  if (st.i >= rows.length) st.i = rows.length - 1;
  return renderPencil(stage, c, st, rows[st.i], rows);
}

// The rest of what the article named, and what became of it, in one line.
function footnote(stage, c) {
  const also = c.also || [];
  if (!also.length) return;
  const p = el("p", "also");
  p.append("Also in this article: ");
  also.forEach((a, i) => {
    if (i) p.append("; ");
    p.append(el("b", null, a.name));
    p.append(a.state === "card" ? " (its own card)"
           : a.state === "not in TTE" ? " (not in TTE; only mentioned)"
           : " (on record, nothing to add)");
  });
  p.append(".");
  stage.append(p);
}

// 1. Is this the person on the card?
// A record found by search arrives with the opening of its description only,
// the index being what ships in the page. Its properties come when it is shown.
function loadRecord(c, o) {
  if (!sb || !o.thin || o.loading || o.failed) return;
  o.loading = true;
  const done = ok => {
    o.loading = false;
    if (ok) o.thin = false; else o.failed = true;
    if (CARDS[at] === c) render();
  };
  Promise.resolve(sb.rpc("desk_record", { record_uid: o.uid })).then(({ data, error }) => {
    if (!error && Array.isArray(data)) { if (data.length) o.fields = data; done(true); } else done(false);
  }).catch(() => done(false));
}

function renderWho(stage, c, st, o) {
  loadRecord(c, o);
  const rows = (o.extra || []).concat(o.uid === c.picked ? c.changes : []);

  const nth = ordered(c).indexOf(o);
  kicker(stage, `Record ${at + 1} of ${CARDS.length}`,
         c.options.length > 1 && [`candidate ${nth + 1} of ${c.options.length}`]);
  stage.append(el("h1", "ask", `Is this TTE record the same ${kind(c)} as the one in the news?`));
  coach(stage, c, "who");
  languageNote(stage, c);
  if (o.romanised || c.romanisedHint) {
    stage.append(el("p", "hint amber", "This record was found through the model's English rendering "
      + `of the name, "${c.entityEn}", which is a guess and can be wrong.`));
  }
  if (c.flagWhy) stage.append(el("p", "hint", c.flagWhy + "."));
  const desk = el("div", "desk");
  desk.append(clipping(c, o, clipFor(c, st), st), authorityCard(c, o));
  stage.append(desk);
  // No advice on which record is right: cataloguers asked for the evidence, not a nudge.
  stage.append(drawer(c, st, o));
  drawerSearch(stage, c, st);
  noteLine(st, stage);

  // Short faces; what each leads to is the line under it.
  const then = rows.length
    ? `then ${rows.length} change${rows.length > 1 ? "s" : ""}, one at a time`
    : "the record is up to date";
  const more = ordered(c).filter(x => x.uid !== o.uid && !st.no[x.uid]).length;
  stamps(stage, [
    ["go", "Same record", "Y", () => {
      st.uid = o.uid; st.i = 0; st.peek = null; st.clipPinned = false;
      rowsFor(c, st).forEach(ch => {
        if (st.tick[keyOf(ch)] === undefined) st.tick[keyOf(ch)] = !ch.derived;
      });
      if (!rowsFor(c, st).length) save(c, "approve"); else render();
    }, "card", "SAME", then],
    ["grey", "Not this record", "N", () => { st.no[o.uid] = true; st.peek = null; render(); }, "card", "NOT THIS RECORD",
     more ? `${more} more candidate${more > 1 ? "s" : ""}` : "then search, or create one"],
    ["amber", "Keep for review", "K", () => save(c, "unsure"), "clip", "KEEP FOR REVIEW", "for the team to discuss"],
  ]);
  tray(stage, c, st);
}

// 2. No card in the drawer is this entity.
function renderNone(stage, c, st) {
  const fresh = c.isNew && !Object.keys(st.no).length;
  kicker(stage, `Record ${at + 1} of ${CARDS.length}`);
  stage.append(el("h1", "ask", fresh
    ? `${c.entity} is not in TTE. Create a record?`
    : `No record for ${c.entity}. Create one?`));
  coach(stage, c, "none");
  languageNote(stage, c);
  if (fresh) {
    stage.append(el("p", "hint", c.options.length
      ? "The model matched none of the nearest names, listed below. If one of them is this "
        + `${kind(c)}, choose it; otherwise decide whether it needs a record.`
      : "No record in TTE came close to this name. The article's facts on the left are what a new record would hold."));
  }
  if (nonLatin(c.entity)) {
    // The search was on a spelling the model invented. Lee Chuan Seng was
    // "Lee, Choon Seng" to it, and TTE had no Chinese name for him.
    stage.append(el("p", "hint amber", (c.entityEn
      ? `The name was searched as "${c.entityEn}", which is the model's own spelling and may be wrong. `
      : "TTE holds no record under this name, and the model gave no English form to search. ")
      + "Search by occupation or description before creating a record, so a person already "
      + "in TTE under another spelling does not get a second one."));
    if (st.finding === undefined) st.finding = true;
  }
  const desk = el("div", "desk");
  desk.append(clipping(c, null, clipFor(c, st), st));
  // The record a "create" would make, from the article's facts, on a card
  // with a dashed edge because it does not exist yet. An empty card here
  // said "No TTE record" and left half the desk bare.
  const draftCard = el("div", "acard draft");
  draftCard.append(el("div", "panel-label", "If you create it"));
  const top = el("div", "acard-top");
  top.append(el("span", "acard-type", c.type), el("span", "acard-uid", "new record"));
  draftCard.append(top, el("h2", "acard-name", c.entityEn ? `${c.entity} (${c.entityEn})` : c.entity));
  if ((c.newsFields || []).length) draftCard.append(lines(fieldMap(c.newsFields), {}, "card"));
  draftCard.append(el("p", "draft-note", (fresh
    ? "Not in TTE yet."
    : (c.options.length ? "Every candidate was set aside." : "No record in TTE came close to this name."))
    + " A new record would start from the article's facts, shown here; a cataloguer makes it in TTE."));
  desk.append(draftCard);
  stage.append(desk);

  const why = el("div", "why");
  REASONS.forEach(([id, label]) => {
    const chip = el("button", "chip" + (st.why === id ? " on" : ""), label);
    chip.onclick = () => { st.why = st.why === id ? "" : id; render(); };
    why.append(chip);
  });
  if (c.options.length && !fresh) { stage.append(el("p", "hint", "Why none of them?")); stage.append(why); }
  // The names the model saw and matched none of, said as such: listed
  // under "candidates" they looked like suggestions.
  stage.append(drawer(c, st, null, fresh
    ? (c.options.length ? "Nearest in TTE, none matched by the model" : "Nothing close in TTE")
    : null));
  drawerSearch(stage, c, st);
  noteLine(st, stage);

  stamps(stage, [
    ["go", "Create a new record", "Y", () => { st.uid = NEW; save(c, "approve"); }, "card", "NEW RECORD", "a cataloguer makes it in TTE"],
    ["grey", "Not worth a record", "N", () => save(c, "reject"), "clip", "NO RECORD", "nothing is created"],
    ["amber", "Keep for review", "K", () => save(c, "unsure"), "clip", "KEEP FOR REVIEW", "for the team to discuss"],
  ]);
  tray(stage, c, st);
}

// 3. One pencil note at a time, drawn on the card where it would go.
function renderPencil(stage, c, st, ch, rows) {
  const o = c.options.find(x => x.uid === st.uid);
  const k = keyOf(ch);
  // The editor is open only when asked for; a value left out sets the
  // reviewer's wording without opening it.
  const editing = !!(st.open || {})[k];
  const reworded = (st.edits || {})[k] != null;

  const cuts = changesText(ch);
  kicker(stage, `Record ${at + 1} of ${CARDS.length}`, o ? o.name : "", [`change ${st.i + 1} of ${rows.length}`]);
  stage.append(el("h1", "ask", ch.diff
    ? (cuts ? "Rewrite the description like this?" : "Add this to the description?")
    : (ch.strategy === "APPEND" ? `Add this to ${SHORT[ch.field] || ch.field}?`
                                : `Set ${ASK_NAME[ch.field] || SHORT[ch.field] || ch.field} to this?`)));
  coach(stage, c, "pencil", ch.field);
  if (ch.derived) {
    stage.append(el("p", "hint amber", "The article states this and the record lacks it. "
      + "The model did not propose it; accept it only if you agree it belongs."));
  }
  if (ch.overEdit) {
    stage.append(el("div", "warnbox", `This rewrite drops most of the current description. Only `
      + `${Math.round(ch.kept * 100)}% of it survives.`));
  }
  if ((ch.held || []).length) {
    const h = ch.held;
    stage.append(el("p", "hint amber", `${h.length} more sentence${h.length > 1 ? "s" : ""} from other articles ${h.length > 1 ? "were" : "was"} held back to keep the description within 5 sentences: `
      + h.map(x => `\u201c${x.length > 140 ? x.slice(0, 140) + "\u2026" : x}\u201d`).join(" ")));
  }
  if (ch.overLimit) {
    stage.append(el("div", "warnbox", `This would make the description ${ch.sentences} sentences. The style guide allows 3 to 5. `
      + `Shorten it with EDIT THE WORDING, or choose NO CHANGE.`));
  }
  // A second clipping is evidence, so it is said where the decision is made.
  // When the clippings disagree, both wordings are offered and the code has
  // no opinion; the reviewer picks.
  const n = (ch.supporters || []).length;
  if (ch.conflict) {
    const box = el("div", "corrob conflict");
    box.append(el("span", "cb-lead", `${n} sources disagree.`));
    box.append(el("span", null, " Choose the wording you trust, or edit it:"));
    const opts = el("div", "why");
    const chosen = (st.edits || {})[k] != null ? st.edits[k] : ch.adding;
    (ch.saidBy || [ch.adding].map(v => ({ value: v, from: "" }))).forEach(({ value, from }) => {
      const chip = el("button", "chip" + (chosen === value ? " on" : ""));
      chip.append(el("b", null, value));
      chip.title = from ? `Use this wording, from source ${sourceIndex(c, from) + 1}: ${(c.sources[sourceIndex(c, from)] || {}).article || from}` : "Use this wording";
      chip.onclick = () => { (st.edits || (st.edits = {}))[k] = value; (st.editText || (st.editText = {}))[k] = value; (st.open || (st.open = {}))[k] = true; render(); };
      opts.append(chip);
      if (from) { const refs = el("sup", "src-refs"); refs.append(sourceTab(c, st, from, clipFor(c, st, ch), true)); opts.append(refs); }
    });
    box.append(opts);
    stage.append(box);
  } else if (n > 1) {
    const box = el("div", "corrob");
    box.append(el("span", "cb-lead", `${n} sources say this.`));
    if ((ch.variants || []).length) {
      box.append(el("span", null, " Also worded: "));
      ch.variants.forEach((v, i) => {
        if (i) box.append(document.createTextNode(" \u00b7 "));
        const b = el("button", "quiet", `\u201c${v}\u201d`);
        b.title = "Use this wording instead";
        b.onclick = () => { (st.edits || (st.edits = {}))[k] = editUnit(ch).compose(v); (st.editText || (st.editText = {}))[k] = v; (st.open || (st.open = {}))[k] = true; render(); };
        box.append(b);
      });
    }
    // Two sources saying nearly the same sentence are one sentence in two
    // wordings, not two sentences: the card offers one and names the
    // other, and a click swaps it in. Stacked, they put the same fact in
    // the description twice.
    (ch.alts || []).forEach(alt => {
      const unit = editUnit(ch);
      const drafts = st.editText || {};
      const current = drafts[k] != null ? drafts[k] : unit.text;
      const inUse = alt.wordings.find(w => current.includes(w)) || alt.wordings[0];
      box.append(el("span", null, " Another source words it: "));
      alt.wordings.filter(w => w !== inUse).forEach((w, i) => {
        if (i) box.append(document.createTextNode(" \u00b7 "));
        const b = el("button", "quiet", `\u201c${w}\u201d`);
        b.title = "Use this wording instead";
        b.onclick = () => {
          const d = st.editText || (st.editText = {});
          const cur = d[k] != null ? d[k] : unit.text;
          d[k] = cur.includes(inUse) ? cur.replace(inUse, w) : (cur + " " + w).trim();
          (st.edits || (st.edits = {}))[k] = unit.compose(d[k]);
          (st.open || (st.open = {}))[k] = true;
          render();
        };
        box.append(b);
      });
    });
    stage.append(box);
  }

  const desk = el("div", "desk");
  // The proposal on the left never changes while it is being edited: the
  // reviewer edits the part being added, below, and sees what the field
  // would then read. Swapping the proposal for the whole edited text made
  // the addition impossible to find.
  desk.append(clipping(c, o, clipFor(c, st, ch), st, ch));
  desk.append(authorityCard(c, o, ch.field));
  stage.append(desk);

  if (editing) {
    const unit = editUnit(ch);
    const wrap = el("div", "editwrap");
    wrap.append(el("div", "edit-label", unit.additive
      ? (ch.diff ? "Your wording of the addition" : `Your wording of what is added to ${SHORT[ch.field] || ch.field}`)
      : `Your wording of ${SHORT[ch.field] || ch.field}`));
    const ta = document.createElement("textarea");
    ta.className = "editor";
    const drafts = st.editText || (st.editText = {});
    if (drafts[k] == null) drafts[k] = unit.text;
    ta.value = drafts[k];
    const result = el("div", "result");
    const show = () => { result.replaceChildren(el("span", "result-label", "Would read"), el("span", null, unit.compose(drafts[k]))); };
    ta.oninput = () => { drafts[k] = ta.value; st.edits[k] = unit.compose(ta.value); show(); };
    show();
    wrap.append(ta, result);
    stage.append(wrap);
  }
  noteLine(st, stage);

  const answer = on => {
    st.tick[k] = on; st.i += 1; st.clipPinned = false;
    if (st.i >= rows.length) save(c, "approve"); else render();
  };
  const next = st.i + 1 < rows.length ? `then change ${st.i + 2} of ${rows.length}` : "and this record is done";
  stamps(stage, [
    ["go", editing ? "Accept my wording" : (reworded ? "Accept the rest" : "Accept"), "Y", () => answer(true), "clip", "ACCEPTED", next],
    ["grey", "No change", "N", () => answer(false), "clip", "NO CHANGE", next],
    ["amber", editing ? "Keep editing" : "Edit the wording", "E", () => {
      if (!editing) {
        const unit = editUnit(ch);
        const drafts = st.editText || (st.editText = {});
        if (drafts[k] == null) drafts[k] = unit.text;
        (st.edits || (st.edits = {}))[k] = unit.compose(drafts[k]);
        (st.open || (st.open = {}))[k] = true;
      }
      render();
    }],
  ]);
  tray(stage, c, st);
}

// What a reviewer edits, and how the field's final value is put together
// from it. An addition is edited on its own and joined to what the record
// already holds; a replacement or a rewrite that removes text is edited whole.
function editUnit(ch) {
  const cuts = changesText(ch);
  if (ch.strategy === "APPEND") {
    const base = (ch.existing || []).join(" | ");
    return { additive: true, text: ch.adding, compose: t => (base && t.trim() ? base + " | " + t.trim() : (t.trim() || base)) };
  }
  if (ch.diff && !cuts) {
    const base = ch.diff.filter(d => d.op !== "in").map(d => d.text).join(" ").trim();
    const added = (ch.adds && ch.adds.length ? ch.adds : ch.diff.filter(d => d.op === "in").map(d => d.text)).join(" ");
    return { additive: true, text: added, compose: t => (base + " " + t.trim()).trim() };
  }
  return { additive: false, text: ch.result || ch.adding, compose: t => t };
}

// The outcomes so far, as the end sheet and the reviewer's sheet both list

  const n = {};

  decided().forEach(l => {
    const o = outcome(l); n[o] = (n[o] || 0) + 1;

    if (l.foundBySearch) searched++;
  });
  const times = decided().map(l => l.seconds).filter(x => x != null).sort((a, b) => a - b);
  const median = times.length ? times[Math.floor(times.length / 2)] : null;
  const dl = el("dl", "tally");
  [["records to create", n["to create"] || 0], ["records to amend", n.amended || 0],
   ["attributes accepted", pencilled], ["same record, nothing to change", n.same || 0],
   ["not worth a record", n["not worth"] || 0], ["kept for review", n["kept for review"] || 0],
   ["notes left for the next librarian", notes],
   ["records found by searching", searched],
   ["median time per record", median == null ? "\u2014" : (median < 90 ? `${median} s` : `${Math.round(median / 60)} min`)]].forEach(([k, v]) => {

function teamCsv() {
  const byKey = {};

// Done in TTE: set once the change has been made in TTE itself. It lives in the

  box.append(el("h2", null, "For the evaluation"));
  box.append(el("p", "hint", "Only you and the evaluation see what you enter here."));

  const week = el("form", "request");
  week.append(el("b", null, "This week"));
  const start = inputOf("date", isoDay(mondayOf(new Date())));
  const way = selectOf(WAYS, "manual");
  const minutes = inputOf("number"); minutes.min = "0"; minutes.placeholder = "minutes";
  const changes = inputOf("number"); changes.min = "0"; changes.placeholder = "changes";
  const r1 = el("div", "form-row"); r1.append(field("Week starting", start), field("How you worked", way));
  const r2 = el("div", "form-row"); r2.append(field("Minutes spent", minutes), field("Changes identified", changes));
  const weekSay = el("p", "hint", "");
  const save = el("button", "stamp grey"); save.append(el("span", "stamp-face", "Save this week"));
  week.append(r1, r2, save, weekSay);
  week.onsubmit = async e => {
    e.preventDefault();
    if (minutes.value === "" || changes.value === "") { weekSay.textContent = "Fill in the minutes and the changes."; return; }
    const { error } = await sb.from("weekly_log").upsert({ reviewer: me.id, week_start: isoDay(mondayOf(new Date(start.value))),
      method: way.value, minutes: Number(minutes.value), changes: Number(changes.value) }, { onConflict: "reviewer,week_start,method" }) || {};
    weekSay.textContent = error ? "Not saved: " + (error.message || "try again") : "Saved. Saving again for the same week replaces it.";
  };

  const log = el("form", "request");
  log.append(el("b", null, "A change you found"));
  const lway = selectOf(WAYS, "manual");
  const link = inputOf("url"); link.placeholder = "https://...";
  const entity = inputOf("text"); entity.placeholder = "as TTE names it, or the new name";
  const uid = inputOf("text"); uid.placeholder = "if it is already in TTE";
  const kindSel = selectOf([["amend", "Change to an existing record"], ["new", "A new record"]], "amend");
  const fld = inputOf("text"); fld.placeholder = "e.g. Affiliations(groupName)";
  const oldv = inputOf("text"); const newv = inputOf("text");
  const day = inputOf("date", isoDay(new Date()));
  const rows = [[field("How you found it", lway), field("Date", day)],
                [field("Article", link)],
                [field("TTE record", entity), field("TTE UID", uid)],
                [field("Kind", kindSel), field("Attribute", fld)],
                [field("Current value", oldv), field("New value", newv)]];
  rows.forEach(r => { const row = el("div", "form-row"); r.forEach(x => row.append(x)); log.append(row); });
  const logSay = el("p", "hint", "");
  const add = el("button", "stamp grey"); add.append(el("span", "stamp-face", "Log this change"));
  log.append(add, logSay);
  log.onsubmit = async e => {
    e.preventDefault();
    if (!entity.value.trim()) { logSay.textContent = "Name the record first."; return; }
    const { error } = await sb.from("change_log").insert({ reviewer: me.id, method: lway.value,
      article_url: link.value.trim() || null, tte_entity: entity.value.trim(), tte_uid: uid.value.trim() || null,
      kind: kindSel.value, field: fld.value.trim() || null, old_value: oldv.value.trim() || null,
      new_value: newv.value.trim() || null, found_on: day.value || isoDay(new Date()) }) || {};
    if (error) { logSay.textContent = "Not logged: " + (error.message || "try again"); return; }
    logSay.textContent = `Logged: ${entity.value.trim()}.`;
    [link, entity, uid, fld, oldv, newv].forEach(x => { x.value = ""; });
  };
  box.append(week, log);
  return box;
}

function endOfShift(stage) {
  const d = el("div", "report");
  d.append(el("h1", "ask", "All done"));
  const searched = decided().filter(l => l.foundBySearch).length;
  d.append(tallyList());
  if (searched) {
    d.append(el("p", "hint", `${searched} record${searched > 1 ? "s were" : " was"} found by search `
      + "that the candidates did not include. Those are the most useful thing you did today: "
      + "each one is a case retrieval should have caught."));
  }
  const noted = NOTED;
  if (noted.length) {
    d.append(el("p", "hint", `${noted.length} entit${noted.length > 1 ? "ies were" : "y was"} read and not asked about: `
      + "on record and up to date, or only mentioned in passing."));
    const ul = el("ul", "noted");
    noted.forEach(nt => {
      const li = el("li");
      li.append(el("b", null, nt.entity), nt.new ? " (not in TTE; mentioned only) " : " (up to date) ");
      const a = el("a", null, nt.article); a.href = nt.link; a.target = "_blank"; a.rel = "noopener noreferrer";
      li.append("in ", a);
      ul.append(li);
    });
    d.append(ul);
  }
  const row = downloadRow();
  const again = el("button", "quiet", "clear everything and start over");
  again.onclick = () => {
    if (!confirm("Clear every decision and start again?")) return;
    labels = {};
    try { localStorage.removeItem(KEY); } catch (e) {}
    at = 0; render();
  };
  row.append(again);
  d.append(row);
  stage.append(d);
}

document.addEventListener("keydown", e => {
  const t = e.target;
  if (t && (t.isContentEditable || t.tagName === "INPUT"
            || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return;
  if (e.metaKey || e.ctrlKey || at >= CARDS.length) return;
  if (document.querySelector(".veil")) return;
  const k = e.key.toLowerCase();
  const alias = { arrowleft: "backspace" };
  const fn = KEYS[k] || KEYS[alias[k]];
  if (fn) { e.preventDefault(); fn(); }
});

// The masthead menu closes once something in it is chosen, or on a click elsewhere.
const menu = document.getElementById("menu");
if (menu) {
  menu.addEventListener("click", e => { if (e.target.tagName === "BUTTON") menu.removeAttribute("open"); });
  document.addEventListener("click", e => { if (menu.open && !menu.contains(e.target)) menu.removeAttribute("open"); });
}

if (ONLINE && sb) {
  loading = "Signing in…"; render();
  Promise.resolve(sb.auth.getSession()).then(({ data }) => {
    loading = "";
    if (data && data.session && data.session.user) return signedIn(data.session.user);
    render();
  }).catch(() => { loading = ""; render(); });
} else {
  if (reviewer) { orderDeck(); at = firstUndecided(); }
  render();
}
</script>
