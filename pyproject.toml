[project]
name = "automated-entity-enrichment"
version = "0.1.0"
description = "Scheduled pipeline: article relevance, entity extraction, entity resolution."
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.31.0",
    "google-genai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "tqdm>=4.66.0",
    "pandas>=2.2.0",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pypdf>=6.19.0",
    "pytest>=8.0.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src` is imported as a package from the repository root. `python -m pytest`
# put the root on sys.path by accident of `-m`; `pytest` alone does not.
pythonpath = ["."]
# Tests must run without network or credentials.
addopts = "-q"
